<style>
:root{
  --bg:#050507; --ink:#e8e3d8; --muted:#a89e90; --dim:#82796e;
  --gold:#d6bc89; --gold2:#b8955a; --line:rgba(213,187,140,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 50% 0%, rgba(91,42,134,.22), transparent 55%),
                   radial-gradient(circle at 50% 100%, rgba(140,20,35,.12), transparent 50%)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}

.back{position:absolute;top:20px;left:20px;z-index:50;padding:10px 16px;border:1px solid rgba(213,187,140,.38);
  background:rgba(7,7,8,.82);color:#d9c7a4;font-size:12px;letter-spacing:.14em}
.back:hover{background:rgba(213,187,140,.08)}

header{text-align:center;padding:96px 20px 26px}
.eyebrow{color:var(--dim);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
h1{margin-top:14px;font-weight:normal;font-size:clamp(30px,6vw,46px);letter-spacing:.14em;color:var(--gold)}
header p{margin:14px auto 0;max-width:520px;color:var(--muted);font-size:16px;line-height:1.6;font-style:italic}

.tabs{display:flex;justify-content:center;gap:10px;margin:8px auto 30px;padding:0 16px}
.tab{padding:10px 18px;border:1px solid var(--line);background:rgba(7,7,8,.6);font-size:12px;letter-spacing:.16em;cursor:pointer;color:var(--muted)}
.tab.on{border-color:rgba(213,187,140,.7);color:var(--gold);background:rgba(213,187,140,.08)}

.mode{display:none;padding:0 16px 70px;text-align:center}
.mode.on{display:block}
.note{color:var(--dim);font-size:13px;font-style:italic;margin-bottom:22px;letter-spacing:.03em}

/* ---------- cards ---------- */
.spread{display:flex;justify-content:center;gap:clamp(10px,3vw,28px);flex-wrap:nowrap}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px}
.slot .pos{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.card{--w:clamp(96px,26vw,170px);width:var(--w);height:calc(var(--w)*1.72);perspective:1200px;cursor:pointer;background:none;border:0;padding:0}
.card.big{--w:clamp(150px,46vw,210px)}
.card .inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back-face{background:#0d0912;border:1px solid rgba(213,187,140,.5);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.back-face svg{width:100%;height:100%;display:block}
.card:not(.flipped):hover .back-face{box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 26px rgba(213,187,140,.25)}
.front-face{transform:rotateY(180deg);background:linear-gradient(160deg,#1a1420,#0b080e 60%,#140d10);
  border:1px solid rgba(213,187,140,.65);box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 30px rgba(213,187,140,.12)}
.front{position:absolute;inset:6%;border:1px solid rgba(213,187,140,.35);border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:9% 6%}
.front.rev{transform:rotate(180deg)}
.front .num{font-size:calc(var(--w)*.085);letter-spacing:.18em;color:var(--gold)}
.front .art{width:72%;color:var(--gold);filter:drop-shadow(0 0 8px rgba(214,188,137,.45))}
.front .art svg{width:100%;height:auto;display:block}
.front .name{font-size:calc(var(--w)*.075);letter-spacing:.12em;text-transform:uppercase;color:#ece2cf;text-align:center;line-height:1.25}

.deal{opacity:0;transform:translateY(-30px) scale(.9)}
.dealt{animation:dealIn .6s ease forwards}
@keyframes dealIn{to{opacity:1;transform:none}}
.shuffling{animation:shake .5s ease-in-out 2}
@keyframes shake{25%{transform:rotate(-4deg) translateX(-6px)}75%{transform:rotate(4deg) translateX(6px)}}

.btn{margin-top:26px;padding:11px 22px;border:1px solid rgba(213,187,140,.45);background:rgba(7,7,8,.7);color:#d9c7a4;
  font-size:12px;letter-spacing:.2em;cursor:pointer}
.btn:hover{background:rgba(213,187,140,.08)}
.hint{margin-top:16px;color:var(--dim);font-size:14px;font-style:italic;min-height:20px}

/* ---------- meanings ---------- */
.readings{max-width:640px;margin:26px auto 0;text-align:left;display:flex;flex-direction:column;gap:16px}
.mean{border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,20,18,.92),rgba(7,7,8,.96));padding:20px 20px 18px;
  animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.mean .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mean .pos{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.mean h3{font-weight:normal;font-size:19px;letter-spacing:.1em;color:var(--gold);margin-top:4px}
.mean .orient{font-size:12px;letter-spacing:.14em;color:#c9a46a;font-style:italic}
.mean .orient.rv{color:#d4848f}
.mean .keys{margin-top:10px;font-size:14px;color:#cfc4b2;letter-spacing:.04em}
.mean p{margin-top:10px;font-size:16px;line-height:1.6;color:#d8d0c5}
.mean .astro{margin-top:12px;font-size:12px;color:var(--dim);letter-spacing:.08em}

footer{text-align:center;color:#5f574e;font-size:12px;font-style:italic;padding:0 20px 40px}

@media (max-width:600px){
  .back{top:14px;left:14px;padding:8px 12px;font-size:11px}
  header{padding-top:78px}
  .tab{padding:9px 12px;font-size:11px}
  .mean{padding:16px}
  .mean p{font-size:15px}
}
</style>

<header>

  <h1>THE TAROT</h1>
  <p>Twenty-two doors of the Major Arcana. Quiet your mind, hold your question, and let the cards speak.</p>

<div class="tabs">
  <button class="tab on" data-mode="day">CARD OF THE DAY</button>

  <div class="note" id="dayNote"></div>

  <div class="hint" id="dayHint">Tap the card to turn it over.</div>
  <div class="readings" id="dayReading"></div>
</section>

<section class="mode" id="mode-three">
  <div class="note">Hold a question or a situation in your mind, then draw.</div>
  <div class="spread" id="threeSpread"></div>
  <div class="hint" id="threeHint"></div>
  <button class="btn" id="drawBtn">SHUFFLE AND DRAW</button>
  <div class="readings" id="threeReading"></div>
</section>

<footer>The cards offer reflection, not certainty. The choice is always yours.</footer>

const BACK = (()=>{
  let rays = '';
  for(let i=0;i<8;i++){
    const a = (i*45-90)*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
    const x1=50+c*9, y1=86+s*9, x2=50+c*24, y2=86+s*24, tx=50+c*31, ty=86+s*31;
    const bx=50+c*22, by=86+s*22, w=5;
    rays += `<path d="M${x1} ${y1} L${x2} ${y2}"/><path d="M${tx} ${ty} L${bx-s*w} ${by+c*w} L${bx+s*w} ${by-c*w}Z" fill="currentColor" stroke="none"/>`;
  }
  return `<svg viewBox="0 0 100 172" preserveAspectRatio="none" style="color:#d6bc89">
    <defs><radialGradient id="bg" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#2a1a3a"/><stop offset="1" stop-color="#0b0710"/></radialGradient>
    <pattern id="pt" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M5 0 L10 5 L5 10 L0 5Z" fill="none" stroke="rgba(214,188,137,.08)" stroke-width=".6"/></pattern></defs>
    <rect width="100" height="172" fill="url(#bg)"/><rect width="100" height="172" fill="url(#pt)"/>
    <rect x="5" y="5" width="90" height="162" rx="4" fill="none" stroke="rgba(214,188,137,.55)" stroke-width=".8"/>
    <rect x="9" y="9" width="82" height="154" rx="3" fill="none" stroke="rgba(214,188,137,.25)" stroke-width=".6"/>
    <circle cx="50" cy="86" r="36" fill="none" stroke="rgba(214,188,137,.3)" stroke-width=".6"/>
    <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">${rays}</g>
    <circle cx="50" cy="86" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
  </svg>`;
})();

function cardEl(cls=''){
  const b = document.createElement('button');
  b.className = 'card ' + cls; b.setAttribute('aria-label','Face-down tarot card');
  b.innerHTML = `<div class="inner"><div class="face back-face">${BACK}</div><div class="face front-face"></div></div>`;
  return b;
}
function setFront(el, card, reversed){
  el.querySelector('.front-face').innerHTML =
    `<div class="front${reversed?' rev':''}"><div class="num">${card.n}</div><div class="art">${card.art}</div><div class="name">${card.name}</div></div>`;
  el.setAttribute('aria-label', `${card.name}${reversed?' (reversed)':''}`);
}
function meaning(card, reversed, pos){
  const d = document.createElement('div'); d.className = 'mean';
  d.innerHTML = `<div class="top"><div>${pos?`<div class="pos">${pos}</div>`:''}<h3>${card.n} · ${card.name}</h3></div>
    <div class="orient${reversed?' rv':''}">${reversed?'Reversed':'Upright'}</div></div>
    <div class="keys">${reversed?card.rv:card.up}</div>
    <p>${reversed?card.rvText:card.upText}</p>
    <div class="astro">${card.astro}</div>`;
  return d;
}

/* ---------- random helpers ---------- */
function seeded(seed){ let t = seed >>> 0; return ()=>{ t += 0x6D2B79F5; let r = Math.imul(t ^ t>>>15, 1|t); r = r + Math.imul(r ^ r>>>7, 61|r) ^ r; return ((r ^ r>>>14)>>>0)/4294967296; }; }
function hash(str){ let h = 2166136261; for(const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h>>>0; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
  document.querySelectorAll('.mode').forEach(m=>m.classList.toggle('on', m.id === 'mode-'+t.dataset.mode));
}));

/* =========================================================
   CARD OF THE DAY
   Signed-in members: one card per account per day (same on every device).
   Visitors who are not signed in: one card per browser per day.
   ========================================================= */
const SUPABASE_URL = "https://gdgraqxbannrdttmtwro.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BPScsIo5l3fnkkcRAQu1Sw_rT7-R7JH";
async function signedInUser(){
  try {
    if(!window.supabase || !window.supabase.createClient) return null;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
      { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, flowType:'pkce' } });
    const { data:{ session } } = await sb.auth.getSession();
    return session && session.user ? session.user : null;
  } catch(e){ return null; }
}
(async function(){
  const now = new Date();
  const today = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
  const dateText = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('dayNote').textContent = dateText + ' · seeking your card…';

  const user = await signedInUser();
  let seeker;
  if(user){
    seeker = 'member:' + user.id;
  } else {
    seeker = store('tarot-seeker');
    if(!seeker){ seeker = Math.random().toString(36).slice(2); store('tarot-seeker', seeker); }
  }
  const seenKey = 'tarot-seen:' + seeker;

  const rnd = seeded(hash(seeker + today));
  const card = CARDS[Math.floor(rnd()*CARDS.length)], reversed = rnd() < REVERSED_CHANCE;
  document.getElementById('dayNote').innerHTML = user
    ? dateText + ' · your card for today<br><span style="font-size:12px;opacity:.75">✦ drawn for your account</span>'
    : dateText + ' · your card for today<br><span style="font-size:12px;opacity:.75">Not signed in: <a href="index.html" style="text-decoration:underline">enter the Temple</a> to draw a card for your own account</span>';
  const el = cardEl('big'); setFront(el, card, reversed);
  document.getElementById('daySlot').appendChild(el);
  const reveal = ()=>{
    if(el.classList.contains('flipped')) return;
    el.classList.add('flipped'); store(seenKey, today);
    document.getElementById('dayHint').textContent = 'A new card waits for you tomorrow.';
    setTimeout(()=>document.getElementById('dayReading').appendChild(meaning(card, reversed)), 500);
  };
  el.addEventListener('click', reveal);
  if(store(seenKey) === today){ el.querySelector('.inner').style.transition = 'none'; reveal();
    requestAnimationFrame(()=>el.querySelector('.inner').style.transition = ''); }
})();

/* =========================================================
   THREE CARDS: past, present, future
   ========================================================= */
(function(){
  const spread = document.getElementById('threeSpread'), out = document.getElementById('threeReading'),
        hint = document.getElementById('threeHint'), btn = document.getElementById('drawBtn');
  const POS = ['Past','Present','Future'];
  let shown = 0;
  function draw(){
    out.innerHTML = ''; spread.innerHTML = ''; shown = 0; hint.textContent = '';
    const deck = CARDS.map((c,i)=>i);
    for(let i=deck.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
    const picks = deck.slice(0,3).map(i=>({ card:CARDS[i], reversed:Math.random() < REVERSED_CHANCE }));
    btn.style.visibility = 'hidden';
    const pile = cardEl(); pile.style.pointerEvents = 'none'; spread.appendChild(pile);
    pile.classList.add('shuffling');
    setTimeout(()=>{
      spread.innerHTML = '';
      picks.forEach((p,i)=>{
        const slot = document.createElement('div'); slot.className = 'slot deal';
        const el = cardEl(); setFront(el, p.card, p.reversed);
        slot.innerHTML = `<div class="pos">${POS[i]}</div>`; slot.appendChild(el);
        spread.appendChild(slot);
        setTimeout(()=>slot.classList.add('dealt'), 180*i);
        el.addEventListener('click', ()=>{
          if(el.classList.contains('flipped')) return;
          el.classList.add('flipped'); shown++;
          // keep the readings in past, present, future order
          setTimeout(()=>{
            const m = meaning(p.card, p.reversed, POS[i]); m.dataset.i = i;
            const after = [...out.children].find(c=>+c.dataset.i > i);
            out.insertBefore(m, after || null);
          }, 450);
          hint.textContent = shown < 3 ? 'Turn over the remaining cards.' : '';
          if(shown === 3){ btn.textContent = 'DRAW AGAIN'; btn.style.visibility = 'visible'; }
        });
      });
      hint.textContent = 'Tap each card to turn it over.';
    }, 1050);
  }
  btn.addEventListener('click', draw);
})();
</script>
