<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive · Temple of Chaos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">

<style>
:root{--bg:#050507;--ink:#e8e3d8;--muted:#a89e90;--dim:#82796e;--gold:#d6bc89;--line:rgba(213,187,140,.28);--line2:rgba(213,187,140,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 50% 0%, rgba(91,42,134,.2), transparent 55%)}
a{color:var(--gold)}
button,input,select,textarea{font-family:inherit;color:inherit}
.topbtn{position:absolute;top:20px;z-index:50;padding:10px 16px;border:1px solid rgba(213,187,140,.38);background:rgba(7,7,8,.82);
  color:#d9c7a4;font-size:12px;letter-spacing:.14em;cursor:pointer;text-decoration:none}
.topbtn:hover{background:rgba(213,187,140,.08)}
.back{left:20px}.langbtn{right:20px;padding:10px 14px}
header{text-align:center;padding:96px 20px 18px}
.eyebrow{color:var(--dim);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
h1{margin-top:14px;font-weight:normal;font-size:clamp(28px,6vw,44px);letter-spacing:.16em;color:var(--gold)}
header p{margin:14px auto 0;max-width:560px;color:var(--muted);font-size:16px;line-height:1.6;font-style:italic}
main{max-width:820px;margin:0 auto;padding:10px 16px 70px;overflow-x:clip}

.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 22px}
.tab{padding:9px 15px;border:1px solid var(--line);background:rgba(7,7,8,.6);font-size:12px;letter-spacing:.14em;cursor:pointer;color:#d9c7a4}
.tab.on{background:rgba(213,187,140,.14);border-color:var(--gold);color:#f0e2c4}
.tab .n{opacity:.7;margin-left:4px}
.btn{padding:10px 16px;border:1px solid rgba(213,187,140,.45);background:rgba(213,187,140,.07);font-size:12px;letter-spacing:.14em;cursor:pointer;color:#e3cfa6}
.btn:hover{background:rgba(213,187,140,.15)}
.btn.ghost{border-color:var(--line2);background:none;color:var(--muted)}
.btn.danger{border-color:rgba(180,80,80,.45);color:#d29a8a;background:none}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- THE LIBRARY ---------- */
.library{position:relative;margin:4px 0 26px;padding:16px 58px 10px 16px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 8%,rgba(0,0,0,0) 92%,rgba(0,0,0,.35)),
             linear-gradient(180deg,#1d130c,#140d08);
  border:10px solid #2c1c10;border-top-width:14px;box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 10px 30px rgba(0,0,0,.6)}
.library:before{content:"";position:absolute;inset:-14px -10px auto -10px;height:6px;background:linear-gradient(#5a3a20,#2c1c10)}
.case{margin-bottom:14px}
.plaque{display:inline-flex;align-items:center;gap:8px;margin:0 0 8px;padding:5px 12px;cursor:pointer;
  background:linear-gradient(180deg,#b8975c,#7d6236);color:#1a1108;border:1px solid #d9bb7f;box-shadow:0 2px 4px rgba(0,0,0,.6);
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-family:inherit}
.plaque .ct{opacity:.75;font-size:11px}
.plaque:hover{filter:brightness(1.1)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,36px);grid-auto-rows:172px;column-gap:2px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 158px,#5b3a1e 158px 161px,#3a2512 161px 168px,#1a0f07 168px 172px)}
.book{align-self:end;justify-self:center;margin-bottom:14px;width:var(--w);height:var(--h);padding:0;cursor:pointer;position:relative;
  border:0;border-radius:2px 2px 1px 1px;color:#e8cf95;
  background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.10) 30%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.5)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),2px 0 3px rgba(0,0,0,.5);transition:transform .2s ease;transform-origin:bottom center}
.book:before,.book:after{content:"";position:absolute;left:3px;right:3px;height:2px;background:rgba(232,207,149,.75)}
.book:before{top:9px;box-shadow:0 4px 0 rgba(232,207,149,.45)}
.book:after{bottom:16px;box-shadow:0 -4px 0 rgba(232,207,149,.45)}
.book .bt{position:absolute;top:22px;bottom:28px;left:0;right:0;writing-mode:vertical-rl;display:block;text-align:center;
  overflow:hidden;font-size:11px;letter-spacing:.05em;line-height:var(--w);text-shadow:0 1px 1px rgba(0,0,0,.8);white-space:nowrap;text-overflow:ellipsis}
.book .bi{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;opacity:.85}
.book:hover{transform:translateY(-10px)}
.book.lean{transform:rotate(9deg);transform-origin:bottom right}
.book.lean:hover{transform:rotate(9deg) translateY(-10px)}
.slot{align-self:end;justify-self:center;margin-bottom:14px;width:30px;height:128px;padding:0;cursor:pointer;
  border:1px dashed rgba(213,187,140,.13);background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,.15));color:transparent;font-size:18px;font-family:inherit}
.slot:hover{border-color:rgba(213,187,140,.55);color:#d6bc89;background:rgba(213,187,140,.06)}
.ladder{position:absolute;top:-18px;bottom:-4px;right:6px;width:36px;pointer-events:none;
  border-left:5px solid #6b4524;border-right:5px solid #6b4524;
  background:repeating-linear-gradient(180deg,transparent 0 30px,#7a5130 30px 35px,#4a2e17 35px 37px);
  box-shadow:3px 3px 8px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.3)}
.ladder:before{content:"";position:absolute;top:-6px;left:-9px;right:-9px;height:6px;border-radius:3px;background:#8a6a3c}
.libnote{color:var(--muted);font-size:14px;font-style:italic;text-align:center;margin:-10px 0 20px}

.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bar input,.bar select{flex:1 1 180px;min-width:0;padding:10px 12px;background:#0d0b0a;border:1px solid var(--line);font-size:15px;color:#e5ddd0}
.bar select{flex:0 1 220px}
.note{color:var(--muted);font-size:14px;font-style:italic;text-align:center;padding:20px 0}

.entry{border-top:1px solid var(--line2);padding:16px 2px;cursor:pointer}
.entry:hover .et{color:#f3e5c6}
.et{font-size:19px;color:#ecdfc3;letter-spacing:.02em;overflow-wrap:anywhere}
.ex{overflow-wrap:anywhere}
.em{margin-top:5px;font-size:12px;color:var(--dim);letter-spacing:.06em}
.ex{margin-top:7px;font-size:15px;line-height:1.55;color:var(--muted)}
.chip{display:inline-block;margin:6px 6px 0 0;padding:2px 8px;border:1px solid var(--line2);font-size:11px;letter-spacing:.08em;color:#c9b38a;cursor:pointer;background:none}
.chip.st{border-color:rgba(224,163,90,.5);color:#e0a35a}
.acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}

/* article */
.article{border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,20,18,.92),rgba(7,7,8,.96));padding:28px 24px}
.article h2.t{font-weight:normal;font-size:clamp(24px,5vw,32px);color:var(--gold);letter-spacing:.04em;line-height:1.25}
.article .em{margin-top:10px}
.prose{margin-top:22px;overflow-wrap:anywhere}
.prose p,.prose li{font-size:17px;line-height:1.75;color:#ddd5c9}
.prose p+p,.prose p+ul,.prose ul+p,.prose p+ol,.prose ol+p{margin-top:14px}
.prose h3{font-weight:normal;font-size:21px;color:#ecdfc3;margin:28px 0 10px;letter-spacing:.03em}
.prose h4{font-weight:normal;font-size:17px;color:var(--gold);margin:22px 0 8px;letter-spacing:.1em;text-transform:uppercase}
.prose ul,.prose ol{padding-left:24px;display:grid;gap:6px;margin-top:10px}
.prose blockquote{margin:16px 0;padding:10px 16px;border-left:2px solid var(--gold);color:#cfc5b6;font-style:italic;background:rgba(213,187,140,.05)}
.prose hr{border:0;border-top:1px solid var(--line2);margin:24px 0}
.prose b{color:#f0e4ca;font-weight:normal}
.prose a.wl{text-decoration:underline dotted}
.prose .missing{color:var(--muted);border-bottom:1px dotted var(--dim)}

/* form */
.form{border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,20,18,.92),rgba(7,7,8,.96));padding:24px 20px;display:grid;gap:14px}
.form h2{font-weight:normal;font-size:15px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.form label{display:grid;gap:6px;font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.form input,.form select,.form textarea{padding:11px 12px;background:#0d0b0a;border:1px solid var(--line);font-size:16px;color:#e5ddd0;text-transform:none;letter-spacing:0;width:100%}
.form textarea{min-height:320px;line-height:1.6;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.help{font-size:13px;line-height:1.6;color:var(--dim);border-left:2px solid var(--line);padding:8px 12px}
.help code{color:#d9c7a4;font-family:inherit}
.msg{font-size:14px;color:#d9c7a4;min-height:18px}
.msg.err{color:#d6907f}
.preview{border:1px dashed var(--line);padding:16px}

/* the opened book: leather cover + parchment page */
.tome{border:0;padding:16px;position:relative;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.10),transparent 60%),linear-gradient(145deg,var(--c),#0b0807 160%);
  box-shadow:0 26px 60px rgba(0,0,0,.65),inset 0 0 0 1px rgba(232,207,149,.35),inset 0 0 0 6px rgba(0,0,0,.25),inset 0 0 0 7px rgba(232,207,149,.28)}
.tome:before,.tome:after{content:"";position:absolute;width:26px;height:26px;border:2px solid rgba(232,207,149,.6);z-index:2}
.tome:before{top:6px;left:6px;border-right:0;border-bottom:0}
.tome:after{bottom:6px;right:6px;border-left:0;border-top:0}
.tome .page{position:relative;margin:0 9px 9px 0;padding:44px 40px 40px;color:#2c2117;
  background:radial-gradient(ellipse at 50% 40%,#f6ead0 0%,#ecdbb6 55%,#d9c093 100%);
  box-shadow:inset 0 0 60px rgba(110,70,25,.35),inset 0 0 6px rgba(80,50,20,.4),3px 3px 0 #e6d3aa,5px 5px 0 #cdb486,7px 7px 0 #e2cea2,9px 9px 0 #b99c6c}
.tome .page:before{content:"";position:absolute;inset:12px;border:1px solid rgba(110,70,30,.35);outline:1px solid rgba(110,70,30,.18);outline-offset:4px;pointer-events:none}
.tome .orn{text-align:center;color:#8a5a2b;letter-spacing:.5em;font-size:14px}
.tome h2.t{text-align:center;color:#4a1a10;margin-top:10px;font-size:clamp(26px,6vw,36px);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.tome .em{text-align:center;color:#6e5638;font-style:italic;letter-spacing:.03em}
.tome .tags{text-align:center}
.tome .chip{border-color:rgba(110,70,30,.35);color:#6b4422}
.tome .chip.st{color:#9a4a12;border-color:rgba(154,74,18,.5)}
.tome .rule{display:flex;align-items:center;gap:12px;margin:22px auto 0;max-width:340px;color:#8a5a2b}
.tome .rule:before,.tome .rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(110,70,30,.6),transparent)}
.tome .prose p,.tome .prose li{color:#2e2318}
.tome .prose > p:first-child::first-letter{float:left;font-size:3.6em;line-height:.85;padding:6px 8px 0 0;color:#6e1c12;font-family:Georgia,"Times New Roman",serif}
.tome .prose h3{color:#4a1a10;text-align:center;margin-top:30px}
.tome .prose h3:before,.tome .prose h3:after{content:" ❦ ";color:#9a6a35;font-size:.7em}
.tome .prose h4{color:#7a4a1c}
.tome .prose b{color:#1f150d;font-weight:bold}
.tome .prose li::marker{color:#8a5a2b}
.tome .prose blockquote{border-left:2px solid #8a5a2b;background:rgba(138,90,43,.08);color:#4a3622}
.tome .prose hr{border-top:1px solid rgba(110,70,30,.35)}
.tome .prose a,.tome a{color:#6e2a12}
.tome .prose .missing{color:#7d6a52;border-bottom-color:#a08868}
.tome .fin{text-align:center;color:#8a5a2b;margin-top:30px;letter-spacing:.3em}
.tome .acts{padding:14px 4px 2px;justify-content:center}
@media (max-width:600px){.tome{padding:10px}.tome .page{padding:34px 22px 30px}.tome .page:before{inset:8px}}

/* bookmark ribbon on the opened book */
.tome .mark{position:absolute;top:-6px;right:34px;z-index:3;width:34px;height:74px;border:0;cursor:pointer;padding:0;
  background:linear-gradient(90deg,#5a1414,#8e2a22 45%,#5a1414);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));transition:height .25s ease,filter .2s;opacity:.38}
.tome .mark.on{opacity:1;height:96px}
.tome .mark:hover{opacity:.85}
.tome .mark span{position:absolute;top:12px;left:0;right:0;text-align:center;color:#f3d9a0;font-size:15px}
.marklabel{display:block;text-align:right;margin:-6px 4px 10px 0;font-size:11px;letter-spacing:.14em;color:var(--dim)}
/* bookmarked books on the shelf */
.book .rb{position:absolute;top:-3px;left:50%;margin-left:-4px;width:8px;height:24px;background:#9a2a20;z-index:2;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
/* translation */
.trbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:0 0 14px}
.trbar .btn{font-size:11px;padding:8px 12px}
.trnote{font-size:12px;color:var(--dim);font-style:italic}
.tome .trnote{display:block;text-align:center;color:#7d6448;margin-top:8px}
/* comments */
.comments{margin-top:34px}
.comments h3{font-weight:normal;text-align:center;color:var(--gold);letter-spacing:.2em;font-size:14px;text-transform:uppercase}
.comments h3:before,.comments h3:after{content:" ❦ ";opacity:.7}
.clist{margin-top:16px;display:grid;gap:10px}
.cm{border:1px solid var(--line2);border-left:2px solid rgba(213,187,140,.45);background:rgba(20,16,14,.7);padding:12px 14px}
.cm .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--dim);letter-spacing:.04em}
.cm .ch b{color:var(--gold);font-weight:normal;letter-spacing:.06em}
.cm .cb{margin-top:6px;font-size:15px;line-height:1.65;color:#ddd5c9;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .cdel{border:0;background:none;color:#a07a6e;font-size:11px;letter-spacing:.1em;cursor:pointer;margin-left:12px}
.trnote[hidden]{display:none !important}
.cform{margin-top:14px;display:grid;gap:10px}
.cform textarea{min-height:90px;padding:11px 12px;background:#0d0b0a;border:1px solid var(--line);font-size:16px;color:#e5ddd0;line-height:1.55;resize:vertical;width:100%}
.cform .acts{margin-top:0}

footer{text-align:center;color:#5f574e;font-size:12px;font-style:italic;padding:0 20px 40px}
@media (max-width:600px){
  .topbtn{top:14px;padding:8px 12px;font-size:11px}.back{left:14px}.langbtn{right:14px}
  header{padding-top:78px}.article{padding:22px 16px}.row{grid-template-columns:1fr}
  .bar select{flex:1 1 100%}
  .library{padding:14px 46px 8px 10px;border-width:7px;border-top-width:10px}.ladder{width:30px;right:5px}
}
</style>
</head>
<body>
<a class="topbtn back" href="index.html" id="backBtn">← TEMPLE</a>
<button class="topbtn langbtn" id="langBtn" type="button" aria-label="Language / Kalba">LT</button>

<header>
  <div class="eyebrow" id="eyebrow">Temple of Chaos</div>
  <h1 id="title">THE ARCHIVE</h1>
  <p id="intro">The memory of the Temple. Deities and spirits, herbs and stones, rituals and prayers, visions and every path, written by its members.</p>
</header>

<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<footer id="foot">Members write; the Temple Keeper approves every entry before it is shown to all.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   EDIT HERE: sections and paths of the Archive
   ========================================================= */
const SECTIONS = [
  { id:'deities',         icon:'☉', en:['Deities & Spirits','Gods, goddesses, spirits and beings: origins, symbols, offerings and myths.'],
                                     lt:['Dievybės ir dvasios','Dievai, deivės, dvasios ir būtybės: kilmė, simboliai, aukos ir mitai.'] },
  { id:'correspondences', icon:'❦', en:['Herbs, Crystals & Symbols','Correspondences for magic: plants, stones, colours, numbers and signs.'],
                                     lt:['Žolelės, kristalai ir simboliai','Atitikmenys magijai: augalai, akmenys, spalvos, skaičiai ir ženklai.'] },
  { id:'rituals',         icon:'✴', en:['Rituals, Spells & Prayers','Rites, workings, spells, invocations and prayers.'],
                                     lt:['Ritualai, burtai ir maldos','Apeigos, darbai, burtai, invokacijos ir maldos.'] },
  { id:'upg',             icon:'☾', en:['Personal Experience (UPG)','Visions, dreams, signs and encounters: what the gods showed you.'],
                                     lt:['Asmeninė patirtis (UPG)','Vizijos, sapnai, ženklai ir susitikimai: ką tau parodė dievai.'] },
  { id:'paths',           icon:'⚶', en:['Paths & Traditions','Every path: their beliefs, history, practices and how to begin.'],
                                     lt:['Keliai ir tradicijos','Visi keliai: jų tikėjimai, istorija, praktikos ir kaip pradėti.'] },
  { id:'other',           icon:'✧', en:['Other','Everything that does not fit elsewhere.'],
                                     lt:['Kita','Visa, kas netelpa kitur.'] }
];
const PATHS = [
  ['chaos','Chaos magic','Chaoso magija'], ['luciferian','Luciferianism','Liuciferizmas'], ['lhp','Left-hand path','Kairiosios rankos kelias'],
  ['hellenic','Hellenic','Helėnų'], ['roman','Roman','Romėnų'], ['baltic','Baltic (Romuva)','Baltų (Romuva)'], ['slavic','Slavic','Slavų'],
  ['norse','Norse','Skandinavų'], ['celtic','Celtic','Keltų'], ['kemetic','Kemetic (Egyptian)','Kemetizmas (Egipto)'],
  ['mesopotamian','Mesopotamian','Mesopotamijos'], ['hindu','Hindu & Shakta','Induizmas ir šaktizmas'], ['buddhist','Buddhist & Tantric','Budizmas ir tantra'],
  ['wicca','Wicca','Vika'], ['witchcraft','Witchcraft','Raganavimas'], ['thelema','Thelema','Telema'], ['hermetic','Hermetic & Occult','Hermetizmas ir okultizmas'],
  ['demonolatry','Demonolatry','Demonolatrija'], ['shamanism','Shamanism & Animism','Šamanizmas ir animizmas'], ['folk','Folk magic','Liaudies magija'],
  ['eclectic','Eclectic','Eklektinis'], ['other','Other','Kitas']
];

/* =========================================================
   LANGUAGE
   ========================================================= */
const LANG = (()=>{ try { const v = localStorage.getItem('temple-lang'); if(v === 'lt' || v === 'en') return v; } catch(e){}
  return (navigator.language || '').toLowerCase().startsWith('lt') ? 'lt' : 'en'; })();
const T = (en, lt) => LANG === 'lt' ? lt : en;
const LOC = T('en-GB','lt-LT');
document.documentElement.lang = LANG;
langBtn.textContent = LANG === 'lt' ? 'EN' : 'LT';
langBtn.addEventListener('click', ()=>{ try { localStorage.setItem('temple-lang', LANG === 'lt' ? 'en' : 'lt'); } catch(e){} location.reload(); });
if(LANG === 'lt'){
  document.title = 'Archyvas · Chaoso šventykla';
  backBtn.textContent = '← ŠVENTYKLA'; eyebrow.textContent = 'Chaoso šventykla'; title.textContent = 'ARCHYVAS';
  intro.textContent = 'Šventyklos atmintis. Dievybės ir dvasios, žolelės ir akmenys, ritualai ir maldos, vizijos ir visi keliai, užrašyti jos narių.';
  foot.textContent = 'Nariai rašo, o Šventyklos sergėtoja patvirtina kiekvieną įrašą, prieš jį pamatant visiems.';
}
const secName = id => { const s = SECTIONS.find(x => x.id === id); return s ? s[LANG][0] : id; };
const pathName = id => { const p = PATHS.find(x => x[0] === id); return p ? (LANG === 'lt' ? p[2] : p[1]) : (id || ''); };

/* =========================================================
   CONNECTION

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleDateString(LOC, { year:'numeric', month:'long', day:'numeric' });

/* =========================================================
   TEXT FORMATTING (simple, safe Markdown)
   ## Heading   ### Small heading   **bold**   *italic*
   - list item   1. numbered   > quote   ---   [[Other entry]]   [text](https://link)
   ========================================================= */
function inline(s){
  s = esc(s);
  s = s.replace(/\[\[([^\]]{1,160})\]\]/g, (m, t) => {
    const e = entries.find(x => x.status === 'approved' && x.title.toLowerCase() === t.trim().toLowerCase());
    return e ? `<a class="wl" href="#e/${e.id}">${t}</a>` : `<span class="missing" title="${esc(T('No entry with this title yet','Tokio įrašo dar nėra'))}">${t}</span>`;
  });
  s = s.replace(/\[([^\]]{1,200})\]\((https?:\/\/[^\s)]{1,500})\)/g, '<a href="$2" target="_blank" rel="noopener nofollow">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  return s;
}
function md(src){
  const lines = String(src || '').replace(/\r/g,'').split('\n');
  let out = '', para = [], list = null;
  const flushP = () => { if(para.length){ out += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const flushL = () => { if(list){ out += `<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.t}>`; list = null; } };
  for(const raw of lines){
    const l = raw.trimEnd();
    let m;
    if(!l.trim()){ flushP(); flushL(); continue; }
    if((m = l.match(/^###\s+(.*)/))){ flushP(); flushL(); out += `<h4>${inline(m[1])}</h4>`; continue; }
    if((m = l.match(/^##?\s+(.*)/))){ flushP(); flushL(); out += `<h3>${inline(m[1])}</h3>`; continue; }
    if(/^-{3,}$/.test(l.trim())){ flushP(); flushL(); out += '<hr>'; continue; }
    if((m = l.match(/^>\s?(.*)/))){ flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if(!list || list.t !== 'ul'){ flushL(); list = { t:'ul', items:[] }; } list.items.push(m[1]); continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if(!list || list.t !== 'ol'){ flushL(); list = { t:'ol', items:[] }; } list.items.push(m[1]); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return out;
}
const plain = s => String(s || '').replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[#>*_`-]+/g,' ').replace(/\s+/g,' ').trim();

const LEATHER = ['#5a1e24','#2b3d2a','#26304d','#4a2648','#4a3018','#1f3d3d','#6a4316','#3d1f1f','#2a2a2e','#3b2a55','#55302a','#1e3a2c'];
function hashN(n){ let x = (Number(n) * 2654435761) >>> 0; x ^= x >>> 15; return x >>> 0; }
function bookLook(e){
  const h = hashN(e.id), len = String(e.body || '').length;
  return { c: LEATHER[h % LEATHER.length],
           w: Math.round(24 + Math.min(10, Math.log2(1 + len / 250) * 2.6)) + 'px',
           h: (120 + (h >> 5) % 30) + 'px' };
}

}

    b.className = 'slot'; b.type = 'button'; b.textContent = '+';

}

/* Automatic translation (free Google Translate). The original text is never changed. */
async function gtx(text, to){
  const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + to + '&dt=t&q=' + encodeURIComponent(text));
  if(!r.ok) throw new Error('translate ' + r.status);
  const j = await r.json();
  return (j[0] || []).map(x => x && x[0] || '').join('');
}
async function translateText(src, to){
  // keeps headings, lists and quotes: only the words after the marks are translated
  const lines = String(src || '').replace(/\r/g,'').split('\n');
  const parts = lines.map(l => {
    if(!l.trim() || /^-{3,}$/.test(l.trim())) return { pre:l, txt:'' };
    const m = l.match(/^(\s*(?:#{1,3}\s+|[-*•]\s+|\d+[.)]\s+|>\s?)?)(.*)$/);
    return { pre:m[1], txt:m[2] };
  });
  const todo = parts.filter(p => p.txt.trim());
  let chunk = [];
  const flush = async () => {
    if(!chunk.length) return;
    const out = (await gtx(chunk.map(p => p.txt).join('\n'), to)).split('\n');
    if(out.length === chunk.length) chunk.forEach((p, i) => p.txt = out[i].trim());
    else for(const p of chunk) p.txt = (await gtx(p.txt, to)).trim();
    chunk = [];
  };
  let size = 0;
  for(const p of todo){
    if(size + p.txt.length > 900){ await flush(); size = 0; }
    chunk.push(p); size += p.txt.length + 1;
  }
  await flush();
  return parts.map(p => p.pre + p.txt).join('\n');
}
async function translateBook(e, btn){
  const titleEl = document.getElementById('artTitle'), bodyEl = document.getElementById('artBody'), note = document.getElementById('trNote');
  const to = btn.dataset.to, key = e.id + ':' + to + ':' + (e.updated_at || '');
  const label = to === 'lt' ? T('TRANSLATE TO LITHUANIAN','IŠVERSTI Į LIETUVIŲ K.') : T('TRANSLATE TO ENGLISH','IŠVERSTI Į ANGLŲ K.');
  if(btn.dataset.done){                       // back to the original
    titleEl.textContent = e.title; bodyEl.innerHTML = md(e.body); note.hidden = true;
    delete btn.dataset.done; btn.textContent = '🌐 ' + label; return;
  }
  btn.disabled = true; btn.textContent = T('Translating…','Verčiama…');
  try {
    if(!trCache[key]) trCache[key] = { title: await gtx(e.title, to), body: await translateText(e.body, to) };
    titleEl.textContent = trCache[key].title;
    bodyEl.innerHTML = md(trCache[key].body);
    note.textContent = T('Automatic translation (Google). It may not be exact; the author wrote the original.','Automatinis vertimas (Google). Jis gali būti netikslus; autorius parašė originalą.');
    note.hidden = false;
    btn.dataset.done = '1'; btn.textContent = '↺ ' + T('SHOW THE ORIGINAL','RODYTI ORIGINALĄ');
  } catch(err){
    console.error('Translation failed', err);
    const url = 'https://translate.google.com/?sl=auto&tl=' + to + '&op=translate&text=' + encodeURIComponent((e.title + '\n\n' + e.body).slice(0, 4500));
    note.innerHTML = T('The translation could not be made right now. ','Vertimo dabar nepavyko padaryti. ') + `<a href="${url}" target="_blank" rel="noopener">${T('Open it in Google Translate','Atverti Google vertėjuje')}</a>`;
    note.hidden = false; btn.textContent = '🌐 ' + label;
  }
  btn.disabled = false;
}

  const { data, error } = await sb.from('archive_comments').select('id,entry_id,author_id,author_name,body,created_at')
    .eq('entry_id', e.id).order('created_at', { ascending:true }).limit(500);
  if(!document.getElementById('cList')) return;          // the reader already left this book
  if(error){ console.error('Comments could not load', error); box.innerHTML = `<div class="note">${T('Comments could not be opened.','Komentarų nepavyko atverti.')}</div>`; return; }
  const list = data || [];
  const trTo = LANG;
  box.innerHTML = list.length ? list.map(c => `<div class="cm" data-cid="${c.id}">
      <div class="ch"><span><b>${esc(c.author_name || '—')}</b> · ${esc(new Date(c.created_at).toLocaleString(LOC, { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }))}</span>
      <span><button class="cdel" data-ctr="${c.id}" type="button">🌐</button>${user && (c.author_id === user.id || isAdmin) ? `<button class="cdel" data-cdel="${c.id}" type="button">${T('DELETE','IŠTRINTI')}</button>` : ''}</span></div>
      <div class="cb">${esc(c.body)}</div></div>`).join('')
    : `<div class="note">${T('No words yet. Be the first to leave one.','Žodžių dar nėra. Būk pirmas (-a), palikęs (-usi) savo.')}</div>`;
  box.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
    if(!confirm(T('Delete this comment?','Ištrinti šį komentarą?'))) return;
    const { error } = await sb.from('archive_comments').delete().eq('id', +b.dataset.cdel);
    if(error){ alert(error.message); return; }
    loadComments(e);
  });
  box.querySelectorAll('[data-ctr]').forEach(b => b.onclick = async () => {
    const c = list.find(x => String(x.id) === b.dataset.ctr), el = b.closest('.cm').querySelector('.cb');
    if(b.dataset.done){ el.textContent = c.body; delete b.dataset.done; return; }
    b.disabled = true;
    try { el.textContent = await translateText(c.body, trTo); b.dataset.done = '1'; }
    catch(err){ console.error('Translation failed', err); }
    b.disabled = false;
  });
}
async function sendComment(e){
  const body = cBody.value.trim(); if(!body) return;
  cSend.disabled = true; cMsg.className = 'msg'; cMsg.textContent = '';
  const { error } = await sb.from('archive_comments').insert({ entry_id:e.id, body });
  cSend.disabled = false;
  if(error){
    console.error('Comment failed', error);
    cMsg.className = 'msg err';
    cMsg.textContent = /silenced/i.test(error.message) ? T('You have been silenced in the Temple.','Tu buvai nutildytas (-a) Šventykloje.')
                     : /too many/i.test(error.message) ? T('Too many comments. Please wait a little.','Per daug komentarų. Šiek tiek palauk.')
                     : T('Could not send: ','Nepavyko išsiųsti: ') + error.message;
    return;
  }
  cBody.value = '';
  loadComments(e);
}

function renderWrite(){
  if(!user){
    view.innerHTML = `<div class="note">${T('Only Temple members can write in the Archive. <a href="index.html">Sign in to the Temple</a> first.','Į Archyvą gali rašyti tik Šventyklos nariai. Pirmiausia <a href="index.html">prisijunk prie Šventyklos</a>.')}</div>`;
    return;
  }
  const e = state.editing || {};
  view.innerHTML = `<form class="form" id="wForm">
    <h2>${e.id ? T('Edit entry','Redaguoti įrašą') : T('Write in the Archive','Rašyti į Archyvą')}</h2>
    <label>${T('Title','Pavadinimas')}<input id="fTitle" required minlength="2" maxlength="160" value="${esc(e.title || '')}"></label>
    <div class="row">
      <label>${T('Section','Skyrius')}<select id="fSec" required>${SECTIONS.map(s => `<option value="${s.id}"${(e.section || state.section) === s.id ? ' selected' : ''}>${esc(s[LANG][0])}</option>`).join('')}</select></label>
      <label>${T('Path / tradition','Kelias / tradicija')}<select id="fPath"><option value="">${T('— none —','— nenurodyta —')}</option>${PATHS.map(p => `<option value="${p[0]}"${e.path === p[0] ? ' selected' : ''}>${esc(LANG === 'lt' ? p[2] : p[1])}</option>`).join('')}</select></label>
    </div>
    <div class="row">
      <label>${T('Tags (comma separated)','Žymos (atskirk kableliais)')}<input id="fTags" maxlength="300" placeholder="${T('e.g. hekate, crossroads, protection','pvz., hekatė, kryžkelė, apsauga')}" value="${esc((e.tags || []).join(', '))}"></label>
      <label>${T('Language of the text','Teksto kalba')}<select id="fLang"><option value="en"${(e.lang || LANG) === 'en' ? ' selected' : ''}>English</option><option value="lt"${(e.lang || LANG) === 'lt' ? ' selected' : ''}>Lietuvių</option></select></label>
    </div>
    <label>${T('Text','Tekstas')}<textarea id="fBody" required maxlength="60000">${esc(e.body || '')}</textarea></label>
    <div class="help">${T(
      '<code>## Heading</code> · <code>### Small heading</code> · <code>**bold**</code> · <code>*italic*</code> · <code>- list</code> · <code>1. numbered</code> · <code>&gt; quote</code> · <code>---</code> line · <code>[[Title of another entry]]</code> links to it · <code>[text](https://…)</code> web link',
      '<code>## Antraštė</code> · <code>### Maža antraštė</code> · <code>**paryškinta**</code> · <code>*pasvirusi*</code> · <code>- sąrašas</code> · <code>1. numeruotas</code> · <code>&gt; citata</code> · <code>---</code> linija · <code>[[Kito įrašo pavadinimas]]</code> nuoroda į jį · <code>[tekstas](https://…)</code> interneto nuoroda')}</div>
    <div class="acts">
      <button class="btn" type="submit" id="fSave">${e.id ? T('SAVE','IŠSAUGOTI') : isAdmin ? T('PUBLISH','PASKELBTI') : T('SUBMIT FOR APPROVAL','PATEIKTI PATVIRTINTI')}</button>
      <button class="btn ghost" type="button" id="fPrev">${T('PREVIEW','PERŽIŪRĖTI')}</button>
      ${e.id ? `<button class="btn ghost" type="button" id="fCancel">${T('CANCEL','ATŠAUKTI')}</button>` : ''}
    </div>
    <div class="msg" id="fMsg">${!e.id && !isAdmin ? T('Your entry will be visible to everyone after the Temple Keeper approves it.','Tavo įrašą visi pamatys, kai jį patvirtins Šventyklos sergėtoja.') : ''}</div>
    <div class="preview" id="fPreview" hidden></div>
  </form>`;
  // keep an unsent draft in this browser
  const DKEY = 'archive-draft';
  if(!e.id){ try { const d = JSON.parse(localStorage.getItem(DKEY) || 'null'); if(d && !fBody.value){ fTitle.value = d.title || ''; fBody.value = d.body || ''; fTags.value = d.tags || ''; } } catch(_){} }
  const saveDraft = () => { if(e.id) return; try { localStorage.setItem(DKEY, JSON.stringify({ title:fTitle.value, body:fBody.value, tags:fTags.value })); } catch(_){} };
  [fTitle, fBody, fTags].forEach(i => i.addEventListener('input', saveDraft));
  fPrev.onclick = () => { fPreview.hidden = !fPreview.hidden; fPreview.innerHTML = `<div class="prose">${md(fBody.value) || ''}</div>`; };
  const fc = document.getElementById('fCancel'); if(fc) fc.onclick = () => { state.editing = null; location.hash = 'e/' + e.id; };
  wForm.onsubmit = async ev => {
    ev.preventDefault();
    const row = { title:fTitle.value.trim(), section:fSec.value, path:fPath.value || null, lang:fLang.value, body:fBody.value.trim(),
                  tags:fTags.value.split(',').map(t => t.trim()).filter(Boolean) };
    if(row.title.length < 2 || !row.body){ fMsg.className = 'msg err'; fMsg.textContent = T('Please write a title and a text.','Įrašyk pavadinimą ir tekstą.'); return; }
    fSave.disabled = true; fMsg.className = 'msg'; fMsg.textContent = T('Saving…','Saugoma…');
    let res;
    if(e.id) res = await sb.from('archive_entries').update(row).eq('id', e.id).select().single();
    else { if(isAdmin) row.status = 'approved'; res = await sb.from('archive_entries').insert(row).select().single(); }
    fSave.disabled = false;
    if(res.error){
      console.error('Archive save failed', res.error);
      fMsg.className = 'msg err';
      fMsg.textContent = /silenced/i.test(res.error.message) ? T('You have been silenced in the Temple.','Tu buvai nutildytas (-a) Šventykloje.') : T('Could not save: ','Nepavyko išsaugoti: ') + res.error.message;
      return;
    }
    if(!e.id){ try { localStorage.removeItem(DKEY); } catch(_){} }
    await load();
    state.editing = null;
    if(res.data.status === 'approved' || isAdmin){ state.tab = 'browse'; location.hash = 'e/' + res.data.id; }
    else { state.tab = 'mine'; location.hash = ''; render(); setTimeout(() => alert(T('Thank you! Your entry was sent to the Temple Keeper for approval.','Ačiū! Tavo įrašas išsiųstas Šventyklos sergėtojai patvirtinti.')), 50); }
  };
}

function renderMine(){
  const list = mine();
  view.innerHTML = list.length ? list.map(e => entryCard(e, e.status === 'pending'
      ? `<button class="btn ghost" data-a="edit" data-id="${e.id}">${T('EDIT','REDAGUOTI')}</button><button class="btn danger" data-a="del" data-id="${e.id}">${T('DELETE','IŠTRINTI')}</button>` : '')).join('')
    : `<div class="note">${T('You have not written anything yet.','Dar nieko neparašei.')}</div>`;
  bindActs(); bindCards(view);
}
function renderReview(){
  const list = pending();
  view.innerHTML = list.length ? list.map(e => entryCard(e,
      `<button class="btn" data-a="approve" data-id="${e.id}">${T('APPROVE','PATVIRTINTI')}</button><button class="btn ghost" data-a="read" data-id="${e.id}">${T('READ','SKAITYTI')}</button><button class="btn ghost" data-a="edit" data-id="${e.id}">${T('EDIT','REDAGUOTI')}</button><button class="btn danger" data-a="del" data-id="${e.id}">${T('REJECT','ATMESTI')}</button>`)).join('')
    : `<div class="note">${T('Nothing is waiting for approval.','Nieko nelaukia patvirtinimo.')}</div>`;
  bindActs(); bindCards(view);
}
function bindActs(){
  view.querySelectorAll('[data-a]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const e = entries.find(x => String(x.id) === b.dataset.id); if(!e) return;
    if(b.dataset.a === 'edit'){ state.editing = e; state.tab = 'write'; render(); }
    if(b.dataset.a === 'del') removeEntry(e);
    if(b.dataset.a === 'approve') approveEntry(e);
    if(b.dataset.a === 'read') location.hash = 'e/' + e.id;
  });
}
async function approveEntry(e){
  const { error } = await sb.from('archive_entries').update({ status:'approved' }).eq('id', e.id);
  if(error){ alert(error.message); return; }
  await load(); render();
}
async function removeEntry(e){
  if(!confirm(T('Delete "' + e.title + '" permanently?', 'Visam laikui ištrinti „' + e.title + '“?'))) return;
  const { error } = await sb.from('archive_entries').delete().eq('id', e.id);
  if(error){ alert(error.message); return; }
  await load(); location.hash = ''; render();
}

function render(){
  const m = location.hash.match(/^#e\/(\d+)/);
  state.open = m ? +m[1] : null;
  renderTabs();
  if(state.open) return renderArticle(entries.find(e => e.id === state.open));
  if(state.tab === 'write') return renderWrite();
  if(state.tab === 'mine' && user) return renderMine();
  if(state.tab === 'saved' && user) return renderSaved();
  if(state.tab === 'review' && isAdmin) return renderReview();
  state.tab = 'browse'; renderBrowse();
}
addEventListener('hashchange', () => { if(!location.hash) state.open = null; render(); });

/* =========================================================
   START
   ========================================================= */
(async function start(){
  view.innerHTML = `<div class="note">${T('Opening the Archive…','Atveriamas Archyvas…')}</div>`;
  try {
    if(window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
        { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, flowType:'pkce' } });
      const { data:{ session } } = await sb.auth.getSession();
      user = session ? session.user : null;
      if(user){ try { const r = await sb.rpc('is_temple_admin'); isAdmin = r.data === true; } catch(_){} }
    }
  } catch(e){ console.error('Temple connection failed', e); sb = null; }
  if(!sb) state.loadError = T('No connection to the Temple.','Nėra ryšio su Šventykla.');
  await load();
  render();
})();
</script>
<script src="presence.js"></script>
</body>
</html>
