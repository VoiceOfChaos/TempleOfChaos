<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple of Chaos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #050507;
            color: #e8e3d8;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        /* -------------------------
           HERO / TEMPLE
        ------------------------- */

        .temple {
            position: relative;
            min-height: 100vh;
            width: 100%;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(30, 30, 35, 0.15),
                    rgba(0, 0, 0, 0.85)
                ),
                #050507;
        }

        .temple-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: 1;
        }

        /* Dark atmospheric layer */

        .temple::after {
            content: "";

            position: absolute;
            inset: 0;

            z-index: 2;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.25) 55%,
                    rgba(0, 0, 0, 0.82) 100%
                );

            pointer-events: none;
        }

        /* -------------------------
           CONTENT
        ------------------------- */

        .temple-content {
            position: relative;

            z-index: 3;

            width: min(900px, 90%);

            text-align: center;

            padding: 40px 20px;
        }

        .eyebrow {
            font-size: 0.8rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;

            margin-bottom: 22px;

            opacity: 0.75;
        }

        h1 {
            font-size: clamp(3rem, 9vw, 7rem);

            font-weight: normal;

            letter-spacing: 0.08em;

            text-transform: uppercase;

            text-shadow:
                0 2px 15px rgba(0, 0, 0, 0.9),
                0 0 35px rgba(0, 0, 0, 0.8);

            margin-bottom: 20px;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.35rem);

            line-height: 1.7;

            max-width: 600px;

            margin: 0 auto 35px;

            color: #d1ccc0;

            text-shadow: 0 2px 10px #000;
        }

        /* -------------------------
           ENTER BUTTON
        ------------------------- */

        .enter-button {
            display: inline-block;

            padding: 15px 38px;

            border: 1px solid rgba(232, 227, 216, 0.65);

            color: #eee9de;

            background: rgba(0, 0, 0, 0.35);

            text-decoration: none;

            text-transform: uppercase;

            letter-spacing: 0.25em;

            font-size: 0.85rem;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

        .enter-button:hover {
            background: rgba(0, 0, 0, 0.7);

            border-color: #ffffff;

            transform: translateY(-3px);
        }

        /* -------------------------
           MOBILE
        ------------------------- */

        @media (max-width: 600px) {

            .temple {
                min-height: 100svh;
            }

            .temple-image {
                object-position: 60% center;
            }

            .temple-content {
                padding: 30px 18px;
            }

            .eyebrow {
                font-size: 0.65rem;
                letter-spacing: 0.3em;
            }

            h1 {
                font-size: clamp(2.5rem, 14vw, 4.5rem);
                letter-spacing: 0.05em;
            }

            .subtitle {
                font-size: 1rem;
                line-height: 1.6;
            }

            .enter-button {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>

<body>

    <main class="temple">

        <img
            class="temple-image"
            src="temple-entrance-master.webp"
            alt="Ancient temple ruins surrounded by forest"
        >

        <div class="temple-content">

            <div class="eyebrow">
                A place beyond order
            </div>

            <h1>
                Temple of Chaos
            </h1>

            <p class="subtitle">
                Enter the ancient sanctuary.
                <br>
                What lies within has no beginning and no end.
            </p>

            <a href="#inside" class="enter-button">
                Enter the Temple
            </a>

        </div>

    </main>

</body>
</html>
