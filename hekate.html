<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crossroads of Hekate</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d8b46a; --ember:#e0592f; --violet:#5b2a86;
  --night:#0b0710; --ink:#ece2d0; --panel:rgba(18,10,24,.92);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);
  font-family:'Cormorant Garamond',serif;touch-action:none;user-select:none;-webkit-user-select:none}

/* ---------- WORLD ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#world{position:absolute;left:0;top:0;width:1400px;height:1400px;will-change:transform;overflow:hidden;
  background:
    radial-gradient(circle at 50% 48%, rgba(91,42,134,.35) 0, rgba(91,42,134,0) 35%),
    repeating-radial-gradient(circle at 13px 17px, rgba(40,70,45,.25) 0 2px, transparent 2px 23px),
    repeating-radial-gradient(circle at 5px 9px, rgba(20,40,25,.4) 0 1.5px, transparent 1.5px 17px),
    radial-gradient(circle at 50% 48%, #1d2a20 0, #111c15 55%, #070d09 100%);}
.ground{position:absolute;pointer-events:none}
.ring{border-radius:50%;border:44px solid rgba(130,110,95,.22);box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 0 30px rgba(0,0,0,.4)}
.plaza{border-radius:50%;background:
  repeating-conic-gradient(from 0deg at 50% 50%, rgba(140,125,115,.22) 0 15deg, rgba(110,95,90,.22) 15deg 30deg);
  box-shadow:0 0 60px rgba(216,180,106,.12), inset 0 0 40px rgba(0,0,0,.6)}
.walk{background:rgba(130,110,95,.22);box-shadow:inset 0 0 14px rgba(0,0,0,.5)}

.sprite{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.flip{display:block;transition:transform .15s}

/* player */
#player .body{animation:none}
#player.moving .body{animation:bob .35s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.lantern{filter:drop-shadow(0 0 6px #ffb347)}
#player::after{content:"";position:absolute;left:50%;top:60%;width:140px;height:140px;transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,190,110,.18), transparent 70%);pointer-events:none}

/* statue + altar */
.halo{animation:pulse 4s ease-in-out infinite;transform-origin:120px 34px}
@keyframes pulse{50%{opacity:.55;transform:scale(1.15)}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.9)}}
#altar{position:relative}
#offerings{position:absolute;left:14px;right:14px;top:-18px;height:40px}
.placed{position:absolute;bottom:0;transform:translateX(-50%);width:30px;height:30px}
.placed svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.placed.new{animation:land .6s ease-out}
@keyframes land{0%{transform:translate(-50%,-40px) scale(1.4);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.altar-glow{position:absolute;inset:-30px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,140,60,.45), transparent 65%);opacity:0;transition:opacity .4s}
.altar-glow.on{opacity:1}

/* symbol stones */
.symbol{display:flex;flex-direction:column;align-items:center}
.glyph{width:44px;height:44px;color:var(--gold);filter:drop-shadow(0 0 6px rgba(216,180,106,.85));animation:float 3.2s ease-in-out infinite}
.glyph svg{width:100%;height:100%}
.stone{width:46px;height:44px;margin-top:6px;border-radius:4px 4px 2px 2px;
  background:linear-gradient(90deg,#3d3745,#6e6578 50%,#3a3442);box-shadow:0 8px 10px rgba(0,0,0,.5);
  border-top:4px solid #7c7388}
.symbol.near .glyph{color:#fff1c8;filter:drop-shadow(0 0 12px rgba(255,220,150,1))}
@keyframes float{50%{transform:translateY(-6px)}}

.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,220,120,.7);
  pointer-events:none;animation:drift linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}20%{opacity:1}50%{transform:translate(30px,-40px)}80%{opacity:1}100%{transform:translate(-20px,-80px);opacity:0}}
.orb{width:10px;height:10px;border-radius:50%;background:#ffcf8a;box-shadow:0 0 14px 5px rgba(255,170,80,.45);animation:float 4s ease-in-out infinite}

/* ---------- UI ---------- */
.ui{position:fixed;z-index:5000}
#topbar{top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
  background:linear-gradient(rgba(11,7,16,.95),rgba(11,7,16,0))}
#topbar h1{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.12em;color:var(--gold);font-weight:400;text-align:center;flex:1}
.btn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;color:var(--ink);background:rgba(91,42,134,.35);
  border:1px solid rgba(216,180,106,.45);border-radius:20px;padding:6px 12px;text-decoration:none;cursor:pointer}
#hint{top:50px;left:50%;transform:translateX(-50%);font-style:italic;font-size:15px;color:rgba(236,226,208,.75);
  text-align:center;padding:0 16px;transition:opacity 1s;pointer-events:none;width:100%}

#card{left:12px;right:12px;bottom:12px;max-width:520px;margin:0 auto;max-height:46vh;overflow-y:auto;
  background:var(--panel);border:1px solid rgba(216,180,106,.4);border-radius:14px;padding:16px 18px 18px;
  box-shadow:0 0 40px rgba(91,42,134,.5);transform:translateY(130%);transition:transform .35s ease}
#card.show{transform:translateY(0)}
#card .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#card .icon{width:40px;height:40px;color:var(--gold);flex:none}
#card h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);font-weight:400}
#card .sub{font-style:italic;font-size:14px;opacity:.7}
#card{z-index:5100}
#card p{font-size:17px;line-height:1.45;margin-bottom:10px}
#card h3{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;color:var(--gold);font-weight:400;
  margin:14px 0 4px;padding-top:10px;border-top:1px solid rgba(216,180,106,.2)}
#card.lore{max-height:62vh}
.figs{display:flex;justify-content:center;gap:24px;margin:4px 0 12px}
.fig{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gold)}
.fig svg{width:96px;height:96px;filter:drop-shadow(0 0 6px rgba(216,180,106,.6))}
.fig span{font-size:13px;font-style:italic;opacity:.75;color:var(--ink)}
#loreBtn{margin:8px 6px 0 0;font-size:10px}
#card .x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer;opacity:.7}

#tray{left:0;right:0;bottom:0;padding:10px 10px 14px;background:linear-gradient(rgba(11,7,16,0),rgba(11,7,16,.96) 30%);
  transform:translateY(110%);transition:transform .35s ease;text-align:center}
#tray.show{transform:translateY(0)}
#tray .label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;color:var(--gold);margin:14px 0 8px}
#items{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.off{width:54px;cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.off .pic{width:46px;height:46px;border-radius:50%;background:rgba(91,42,134,.3);border:1px solid rgba(216,180,106,.35);
  display:flex;align-items:center;justify-content:center}
.off .pic svg{width:32px;height:32px;pointer-events:none}
.off span{font-size:12px;line-height:1.1;opacity:.85}
#clear{margin-top:8px;font-size:10px;opacity:.7}

.ghost{position:fixed;z-index:9000;width:48px;height:48px;transform:translate(-50%,-50%) scale(1.2);pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(255,200,120,.9))}
.ghost svg{width:100%;height:100%}
#toast{left:50%;top:90px;transform:translate(-50%,-20px);max-width:90%;width:max-content;background:var(--panel);
  border:1px solid rgba(216,180,106,.5);border-radius:12px;padding:10px 16px;font-size:16px;font-style:italic;text-align:center;
  opacity:0;transition:all .4s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* cloak colour picker */
#cloakBtn{display:flex;align-items:center;gap:6px;width:auto}
#cloakBtn .sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
#cloakPanel{top:54px;right:12px;width:232px;background:var(--panel);border:1px solid rgba(216,180,106,.4);border-radius:14px;
  padding:14px 12px 12px;box-shadow:0 0 40px rgba(0,0,0,.6);display:none}
#cloakPanel.show{display:block}
#cloakPanel .t{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;color:var(--gold);text-align:center;margin-bottom:12px}
#cloakPanel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;justify-items:center}
.cl{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:transform .15s}
.cl:hover{transform:scale(1.1)}
.cl.on{border-color:#fff1c8;box-shadow:0 0 12px rgba(255,220,150,.8)}
#cloakPanel .name{margin-top:12px;text-align:center;font-style:italic;font-size:15px;opacity:.85}
</style>
</head>
<body>

<div id="viewport"><div id="world"></div></div>

<div id="topbar" class="ui">
  <a class="btn" href="gardens.html">← Gardens</a>
  <h1>Crossroads of Hekate</h1>
  <button id="cloakBtn" class="btn" aria-label="Choose cloak colour"><span class="sw"></span>Cloak</button>
</div>
<div id="cloakPanel" class="ui">
  <div class="t">CHOOSE YOUR CLOAK</div>
  <div class="grid"></div>
  <div class="name"></div>
</div>
<div id="hint" class="ui">Tap anywhere to walk (or use arrow keys / WASD).<br>Visit her symbols, then bring offerings to the altar.</div>

<div id="card" class="ui">
  <button class="x" aria-label="Close">×</button>
  <div class="head"><div class="icon"></div><div><h2></h2><div class="sub"></div></div></div>
  <div class="body"></div>
</div>

<div id="tray" class="ui">
  <div class="label">Drag an offering onto the altar</div>
  <div id="items"></div>
  <button id="loreBtn" class="btn">✦ Her lore</button>
  <button id="clear" class="btn">Clear the altar</button>
</div>
<div id="toast" class="ui"></div>

<script>
/* =========================================================
   EDIT HERE: deity, symbols and offerings
   ========================================================= */
const DEITY = "HEKATE";
const STORAGE_KEY = "garden-offerings-hekate";

  { name:"The Key", sub:"Keeper of thresholds",

  { name:"Hekate's Wheel", sub:"The Strophalos",
    text:"In the Chaldean Oracles, the strophalos is a spinning wheel tied to Hekate's power. The wheel drawn today, a serpentine maze around a centre, is a modern design inspired by it. It stands for the cycles of life, the journey inward, and Hekate as the soul of the world.",
    svg:`<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="30" cy="30" r="26"/><circle cx="30" cy="30" r="7"/><path d="M30 23 C38 16 50 22 54 30 M36.1 33.5 C38 44 30 54 21 52 M23.9 33.5 C14 36 6 26 9 18 M30 4 V10 M52.5 43 L47.3 40 M7.5 43 L12.7 40"/></svg>` },
  { name:"The Crossroads", sub:"Where three roads meet",
    text:"The ancient Greeks set Hekate's shrines where three roads met, and beside the doors of their homes. The crossroads is a place of choice and of in-between: where roads, worlds and fates part, she stands watching all three ways at once.",
    svg:`<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M30 32 V56 M30 32 L9 13 M30 32 L51 13"/><circle cx="30" cy="32" r="4.5" fill="currentColor" stroke="none"/></svg>` },
  { name:"The Black Hounds", sub:"Her companions",
    text:"Dogs were sacred to Hekate, and their barking in the night was said to announce her coming. Her black hounds guard the gates, roam between the worlds, and are loyal guides through the dark.",
    svg:`<svg viewBox="0 0 60 60"><path d="M12 52 L17 35 C17 27 21 21 27 19 L29 7 L35 17 L40 16 C45 18 49 22 53 25 L51 31 L41 31 C38 37 40 45 45 52Z" fill="currentColor"/><circle cx="37" cy="22" r="1.8" fill="#0b0710"/></svg>` },

    text:"The last night before the new moon belongs to her. In ancient Athens, households set out Hekate's Supper, the Deipnon, that night. Food was left at the crossroads to honour her and to settle the restless dead, as the old month was cleansed away.",
    svg:`<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="#0b0710" stroke="currentColor" stroke-width="2"/><path d="M30 8 A22 22 0 0 1 30 52 A17 22 0 0 0 30 8Z" fill="currentColor"/></svg>` },
  { name:"The Serpent", sub:"Rebirth and the deep",
    text:"Many descriptions have serpents coiled in her hair or around her body. Serpents belong to the earth and the underworld. They shed their skin to be born again, and they carry the hidden wisdom of the depths.",

  name:"Hekate", sub:"Queen of Witches · Lady of the Crossroads",
  sections:[
    { title:"Her Name",
      text:"Hekatē is often read as “the far-reaching one” or “she who works from afar”, though the true origin of the name is uncertain. Some scholars trace her worship to Caria in Asia Minor, where her great sanctuary stood at Lagina." },
    { title:"Daughter of Titans",
      text:"Hesiod's Theogony, from around 700 BCE, names her the daughter of the Titans Perses and Asteria, and praises her above almost every other deity. Zeus honoured her, Hesiod says, with a share of the earth, the sea and the starry sky: power in all three realms." },
    { title:"Torchbearer of the Underworld",

    { title:"The Triple Goddess",
      text:"From the 5th century BCE she was often carved in triple form: three figures standing back to back, facing three directions. These statues, called hekataia, stood at crossroads and outside front doors, guarding the threshold of the home." },
    { title:"Queen of Witches",
      text:"She became the goddess of magic, ghosts and necromancy. Medea, the most famous witch of Greek myth, was her priestess, and many spells in the Greek Magical Papyri call on her name. In the Chaldean Oracles she rises to cosmic power as the soul of the world." },
    { title:"In Modern Practice",
      text:"Today she is one of the most honoured goddesses in witchcraft and paganism. People call on her for protection, magic, shadow work, guidance at life's crossroads, and contact with the dead. Many keep the Deipnon every dark moon." },

      text:"Moon: the dark moon. Colours: black, silver and deep red. Animals: dogs, serpents, the polecat and the owl. Plants: yew, mugwort, garlic and poppy. Symbols: torches, keys, the wheel and the crossroads. Offerings: garlic, honey, eggs, bread, pomegranate and candles." }

const OFFERINGS = {
  candle:{ label:"Black candle", msg:"A black candle burns: a light kindled in the dark, like her torches.",
    svg:`<svg viewBox="0 0 40 40"><rect x="15" y="16" width="10" height="21" rx="2" fill="#141014" stroke="#9a8fb0" stroke-width="1"/><path class="flame" d="M20 4 C25 9 25 13 20 15 C15 13 15 9 20 4Z" fill="#ffb347"/></svg>` },

    svg:`<svg viewBox="0 0 40 40" fill="none" stroke="#cfc6e0" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="20" r="6"/><path d="M18 20 H35 M30 20 V26 M34 20 V25"/></svg>` }

/* =========================================================
   WORLD SETUP
   ========================================================= */
const W = 1400, H = 1400, CX = 700, CY = 680;
const world = document.getElementById('world');
const vp = document.getElementById('viewport');
const obstacles = [];

function el(cls, x, y, html, z){
  const d = document.createElement('div');
  d.className = 'sprite ' + (cls||'');
  d.style.left = x + 'px'; d.style.top = y + 'px';
  d.style.zIndex = z !== undefined ? z : Math.round(y);
  d.innerHTML = html; world.appendChild(d); return d;
}
function ground(cls, x, y, w, h){
  const d = document.createElement('div');
  d.className = 'ground ' + cls;
  Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  world.appendChild(d); return d;
}

// paths
const ROADS = [90, 210, 330]; // three roads meet at her statue
ROADS.forEach(a=>{
  const d = ground('walk', CX, CY-24, 1100, 48);
  d.style.transformOrigin = '0 24px'; d.style.transform = `rotate(${a}deg) translateX(180px)`;
});
function onRoad(x, y){
  return ROADS.some(a=>{
    const r = a*Math.PI/180, dx = x-CX, dy = y-CY;
    return dx*Math.cos(r)+dy*Math.sin(r) > 150 && Math.abs(-dx*Math.sin(r)+dy*Math.cos(r)) < 70;
  });
}
ground('ring', CX-442, CY-442, 884, 884);
ground('plaza', CX-200, CY-200, 400, 400);

<path class="flame" d="M194 18 C204 28 204 38 194 46 C184 38 184 28 194 18Z" fill="#ff8a3d"/>

<circle cx="166" cy="98" r="12" fill="#6b6376" stroke="#2a2430"/>
<path d="M178 97 L182 100 L178 102" fill="#6b6376" stroke="#2a2430"/>
<rect x="158" y="82" width="16" height="6" fill="#4b4453"/>
<!-- centre face -->
<path d="M100 100 Q120 92 140 100 L153 252 Q120 260 87 252Z" fill="url(#st)" stroke="#2a2430"/>
<path d="M112 112 L105 250 M128 112 L134 250 M120 114 V253" stroke="#2a2430" stroke-opacity=".45" fill="none"/>
<path d="M102 108 C96 124 104 136 114 140 M138 108 C144 124 136 136 126 140" stroke="#6b6376" stroke-width="8" stroke-linecap="round" fill="none"/>
<circle cx="120" cy="146" r="7" fill="none" stroke="#d8b46a" stroke-width="2.5"/>
<path d="M120 153 V182 M120 172 H127 M120 178 H125" stroke="#d8b46a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="120" cy="82" r="15" fill="#7d7489" stroke="#2a2430"/>
<rect x="110" y="62" width="20" height="8" fill="#5d5566" stroke="#2a2430"/>
<circle cx="115" cy="83" r="1.8" fill="#d6d0ee"/><circle cx="125" cy="83" r="1.8" fill="#d6d0ee"/>
<rect x="44" y="250" width="152" height="14" fill="#5d5566"/>
<rect x="64" y="264" width="112" height="46" fill="#4b4453"/>
<rect x="50" y="308" width="140" height="12" fill="#3b3543"/>
<text x="120" y="292" text-anchor="middle" font-family="Cinzel,serif" font-size="12" letter-spacing="2" fill="#d8b46a">${DEITY}</text>
</svg>`;
el('', CX, CY-30, statueSVG);
obstacles.push({x:CX, y:CY-60, r:70});

// altar
const altarSVG = `<div id="altar"><div class="altar-glow"></div>
<svg viewBox="0 0 220 90" width="220" height="90">
 <rect x="4" y="18" width="212" height="16" rx="2" fill="#5d5566"/>
 <rect x="4" y="18" width="212" height="3" fill="#d8b46a" opacity=".55"/>
 <rect x="14" y="34" width="192" height="52" fill="#3b3543"/>
 <g stroke="#d8b46a" stroke-width="1.6" fill="none" opacity=".7" stroke-linecap="round"><circle cx="110" cy="60" r="17"/><circle cx="110" cy="60" r="5"/><path d="M110 55 C116 50 124 54 126 60 M114 63 C115 70 110 76 104 75 M106 63 C100 64 95 58 97 53"/></g>
 <rect x="12" y="4" width="6" height="14" fill="#1a1a1a"/><path class="flame" d="M15 -6 C19 -2 19 1 15 3 C11 1 11 -2 15 -6Z" fill="#ffb347"/>
 <rect x="202" y="4" width="6" height="14" fill="#1a1a1a"/><path class="flame" d="M205 -6 C209 -2 209 1 205 3 C201 1 201 -2 205 -6Z" fill="#ffb347"/>
</svg><div id="offerings"></div></div>`;
const ALTAR = {x:CX, y:CY+100};
el('', ALTAR.x, ALTAR.y, altarSVG);
[-70,-25,25,70].forEach(dx=>obstacles.push({x:CX+dx, y:ALTAR.y-25, r:26}));
const altarEl = document.getElementById('altar');
const offEl = document.getElementById('offerings');
const glowEl = document.querySelector('.altar-glow');

// symbols around the garden
const ANGLES = [5,45,135,175,240,270,300];
const symbolEls = SYMBOLS.map((s,i)=>{
  const a = ANGLES[i]*Math.PI/180, r = 480;
  s.x = CX + Math.cos(a)*r; s.y = CY + Math.sin(a)*r + 30;
  obstacles.push({x:s.x, y:s.y-15, r:24});
  return el('symbol', s.x, s.y, `<div class="glyph">${s.svg}</div><div class="stone"></div>`);
});

// floating lights along the ring
for(let i=0;i<16;i++){
  const a = i/16*Math.PI*2 + .2;
  if (ROADS.some(r=>Math.abs(((a*180/Math.PI - r)%360+540)%360-180) < 8)) continue;
  el('', CX+Math.cos(a)*372, CY+Math.sin(a)*372, '<div class="orb"></div>');
}

// seeded trees and rose bushes
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = rng(666);
const cypress = `<svg viewBox="0 0 40 110" width="40" height="110"><ellipse cx="20" cy="106" rx="14" ry="4" fill="rgba(0,0,0,.45)"/><rect x="18" y="92" width="4" height="14" fill="#2b1d14"/><path d="M20 2 C34 30 32 70 20 96 C8 70 6 30 20 2Z" fill="#10241a" stroke="#1f3d2b"/></svg>`;
const bush = `<svg viewBox="0 0 60 40" width="60" height="40"><ellipse cx="30" cy="36" rx="26" ry="4" fill="rgba(0,0,0,.4)"/><ellipse cx="30" cy="22" rx="26" ry="15" fill="#15301f"/><circle cx="17" cy="16" r="3.5" fill="#a3172b"/><circle cx="34" cy="12" r="3.5" fill="#a3172b"/><circle cx="44" cy="22" r="3.5" fill="#a3172b"/><circle cx="25" cy="26" r="3.5" fill="#8a1424"/></svg>`;
let placedTrees = 0, tries = 0;
while(placedTrees < 70 && tries < 2000){
  tries++;
  const x = 40 + rand()*(W-80), y = 60 + rand()*(H-100);
  const d = Math.hypot(x-CX, y-CY);
  const okZone = (d > 545) || (d > 235 && d < 345);
  const onSouthPath = onRoad(x, y);
  const tooClose = obstacles.some(o=>Math.hypot(o.x-x,o.y-y) < o.r+40);
  if(!okZone || onSouthPath || tooClose) continue;
  const isBush = rand() < .35;
  el('', x, y, isBush ? bush : cypress);
  obstacles.push({x, y:y-6, r:isBush?22:13});
  placedTrees++;
}

// fireflies
for(let i=0;i<34;i++){
  const f = document.createElement('div'); f.className='fly';
  f.style.left = (rand()*W)+'px'; f.style.top = (rand()*H)+'px';
  f.style.animationDuration = (5+rand()*7)+'s'; f.style.animationDelay = (-rand()*10)+'s';
  f.style.zIndex = 3000; world.appendChild(f);
}

// player
const player = el('', 0, 0, `<div class="flip"><div class="body"><svg viewBox="0 0 40 52" width="38" height="50">
<ellipse cx="20" cy="49" rx="12" ry="3" fill="rgba(0,0,0,.5)"/>
<path class="cloak" d="M20 5 C11 5 9 16 10 22 L5 48 H35 L30 22 C31 16 29 5 20 5Z" fill="#2b1f3a" stroke="#7a5a9c"/>
<path d="M14 18 C14 12 26 12 26 18 C26 23 14 23 14 18Z" fill="#0b0710"/>
<circle cx="17.5" cy="18" r="1.3" fill="#ffcf70"/><circle cx="22.5" cy="18" r="1.3" fill="#ffcf70"/>
<path d="M30 27 L33 30" stroke="#999"/><circle class="lantern" cx="33" cy="34" r="4" fill="#ffb347"/>
</svg></div></div>`);
player.id = 'player';
const flipEl = player.querySelector('.flip');

/* =========================================================
   MOVEMENT + CAMERA
   ========================================================= */
let px = CX, py = H-90, tx = null, ty = null, facing = 1;
let camX = 0, camY = 0;
const SPEED = 190, keys = {};
const KEYMAP = {ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{ if(KEYMAP[e.key]){keys[KEYMAP[e.key]]=true; e.preventDefault(); hideHint();} });
addEventListener('keyup',e=>{ if(KEYMAP[e.key]) keys[KEYMAP[e.key]]=false; });

vp.addEventListener('pointerdown', e=>{
  tx = e.clientX + camX; ty = e.clientY + camY; hideHint();
});

function collide(){
  for(const o of obstacles){
    const dx = px-o.x, dy = py-o.y, d = Math.hypot(dx,dy), min = o.r + 12;
    if(d < min && d > 0.01){ px = o.x + dx/d*min; py = o.y + dy/d*min; }
  }
  px = Math.max(20, Math.min(W-20, px)); py = Math.max(40, Math.min(H-10, py));
}

function step(dt){
  let vx = (keys.r?1:0)-(keys.l?1:0), vy = (keys.d?1:0)-(keys.u?1:0);
  if(vx||vy) tx = null;
  else if(tx !== null){
    const dx = tx-px, dy = ty-py, d = Math.hypot(dx,dy);
    if(d < 5) tx = null; else { vx = dx/d; vy = dy/d; }
  }
  const m = Math.hypot(vx,vy), moving = m > 0;
  if(moving){
    vx/=m; vy/=m;
    const ox = px, oy = py;
    px += vx*SPEED*dt; py += vy*SPEED*dt; collide();
    if(tx !== null && Math.hypot(px-ox,py-oy) < SPEED*dt*0.25) tx = null; // stuck
    if(Math.abs(vx) > .2) facing = vx < 0 ? -1 : 1;
  }
  player.classList.toggle('moving', moving);
  flipEl.style.transform = `scaleX(${facing})`;
  player.style.left = px+'px'; player.style.top = py+'px'; player.style.zIndex = Math.round(py);

  const vw = innerWidth, vh = innerHeight;
  const goalX = vw >= W ? (W-vw)/2 : Math.max(0, Math.min(W-vw, px - vw/2));
  const goalY = vh >= H ? (H-vh)/2 : Math.max(0, Math.min(H-vh, py - vh*0.45));
  camX += (goalX-camX)*Math.min(1, dt*6); camY += (goalY-camY)*Math.min(1, dt*6);
  world.style.transform = `translate(${-camX}px,${-camY}px)`;

  checkNearby();
}

let last = performance.now();
camX = Math.max(0, Math.min(W-innerWidth, px-innerWidth/2));
camY = Math.max(0, Math.min(H-innerHeight, py-innerHeight*0.45));
function loop(t){ const dt = Math.min(.05,(t-last)/1000); last = t; step(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* =========================================================
   SYMBOL CARDS + ALTAR TRAY
   ========================================================= */
const card = document.getElementById('card'), tray = document.getElementById('tray');
let current = -1, dismissed = -1, loreOpen = false;
card.querySelector('.x').addEventListener('click', ()=>{ dismissed = current; loreOpen = false; showCard(-1); });
document.getElementById('loreBtn').addEventListener('click', ()=>{ loreOpen = true; dismissed = -1; });

function showCard(i){
  if(i === current) return;
  current = i;
  symbolEls.forEach((s,k)=>s.classList.toggle('near', k===i));
  if(i === -1){ card.classList.remove('show'); return; }
  const isLore = i === 'lore';
  const s = isLore ? LORE : SYMBOLS[i];
  card.classList.toggle('lore', isLore);
  card.querySelector('.icon').innerHTML = SYMBOLS[isLore ? 0 : i].svg;
  card.querySelector('h2').textContent = s.name;
  card.querySelector('.sub').textContent = s.sub;
  const body = card.querySelector('.body'); body.innerHTML = '';
  if(!isLore && s.figures){
    const row = document.createElement('div'); row.className = 'figs';
    s.figures.forEach(f=>{
      const fig = document.createElement('div'); fig.className = 'fig';
      fig.innerHTML = f.svg; const c = document.createElement('span'); c.textContent = f.caption;
      fig.appendChild(c); row.appendChild(fig);
    });
    body.appendChild(row);
  }
  (isLore ? s.sections : [{text:s.text}]).forEach(sec=>{
    if(sec.title){ const h = document.createElement('h3'); h.textContent = sec.title; body.appendChild(h); }
    const p = document.createElement('p'); p.textContent = sec.text; body.appendChild(p);
  });
  card.scrollTop = 0; card.classList.add('show');
}
function checkNearby(){
  let best = -1, bd = 110;
  SYMBOLS.forEach((s,i)=>{ const d = Math.hypot(px-s.x, py-s.y); if(d < bd){ bd = d; best = i; } });
  const nearAltar = Math.hypot(px-ALTAR.x, py-ALTAR.y) < 170;
  if(!nearAltar) loreOpen = false;
  if(best === -1 && (loreOpen || Math.hypot(px-CX, py-(CY-60)) < 150)) best = 'lore';
  if(best !== dismissed) showCard(best);
  if(best === -1) dismissed = -1;
  tray.classList.toggle('show', nearAltar);
}

/* =========================================================
   OFFERINGS (drag & drop, saved in this browser)
   ========================================================= */
let placed = [];
try { placed = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e){ placed = []; }
function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(placed)); } catch(e){} }
function render(animateLast){
  offEl.innerHTML = placed.map(o=>`<div class="placed" style="left:${o.f*100}%">${OFFERINGS[o.t].svg}</div>`).join('');
  if(animateLast && offEl.lastElementChild) offEl.lastElementChild.classList.add('new');
}
render();

const items = document.getElementById('items');
Object.entries(OFFERINGS).forEach(([key,o])=>{
  const d = document.createElement('div'); d.className='off'; d.dataset.type = key;
  d.innerHTML = `<div class="pic">${o.svg}</div><span>${o.label}</span>`;
  items.appendChild(d);
});

let ghost = null, dragType = null;
function moveGhost(e){ ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px'; }
items.addEventListener('pointerdown', e=>{
  const it = e.target.closest('.off'); if(!it) return;
  e.preventDefault(); e.stopPropagation();
  dragType = it.dataset.type;
  ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.innerHTML = OFFERINGS[dragType].svg;
  document.body.appendChild(ghost); moveGhost(e);
  try { it.setPointerCapture(e.pointerId); } catch(_){}
});
addEventListener('pointermove', e=>{
  if(!ghost) return; moveGhost(e);
  glowEl.classList.toggle('on', overAltar(e));
});
addEventListener('pointerup', e=>{
  if(!ghost) return;
  if(overAltar(e)){
    const r = altarEl.getBoundingClientRect();
    placeOffering(dragType, Math.max(.08, Math.min(.92, (e.clientX - r.left)/r.width)));
  }
  endDrag();
});
addEventListener('pointercancel', endDrag);
function endDrag(){ if(ghost) ghost.remove(); ghost = null; glowEl.classList.remove('on'); }
function overAltar(e){
  const r = altarEl.getBoundingClientRect();
  return e.clientX > r.left-25 && e.clientX < r.right+25 && e.clientY > r.top-70 && e.clientY < r.bottom+15;
}
function placeOffering(type, f){
  placed.push({t:type, f, ts:Date.now()});
  if(placed.length > 14) placed.shift();
  save(); render(true); toast(OFFERINGS[type].msg);
  glowEl.classList.add('on'); setTimeout(()=>glowEl.classList.remove('on'), 900);
}
document.getElementById('clear').addEventListener('click', ()=>{
  placed = []; save(); render(); toast("The altar is cleansed.");
});
tray.addEventListener('pointerdown', e=>e.stopPropagation());
card.addEventListener('pointerdown', e=>e.stopPropagation());
document.getElementById('topbar').addEventListener('pointerdown', e=>e.stopPropagation());

const toastEl = document.getElementById('toast'); let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 3200); }

const hintEl = document.getElementById('hint'); let hintGone = false;
function hideHint(){ if(hintGone) return; hintGone = true; setTimeout(()=>hintEl.style.opacity = 0, 2500); }

/* =========================================================
   CLOAK COLOURS (remembered across all gardens)
   ========================================================= */
const CLOAKS = [
  { name:"Midnight Violet", fill:"#2b1f3a", edge:"#7a5a9c" },
  { name:"Blood Crimson",   fill:"#5a1020", edge:"#c0404f" },
  { name:"Void Black",      fill:"#121014", edge:"#4a4450" },
  { name:"Deep Forest",     fill:"#183222", edge:"#4f8a5e" },
  { name:"Abyssal Sea",     fill:"#132a40", edge:"#4a7eaa" },
  { name:"Bone White",      fill:"#cfc6b8", edge:"#f2ece0" },
  { name:"Ancient Gold",    fill:"#5a4614", edge:"#d8b46a" },
  { name:"Wild Rose",       fill:"#5a2236", edge:"#e06a8c" }
];
const cloakPath = player.querySelector('.cloak');
const cloakPanel = document.getElementById('cloakPanel');
const cloakGrid = cloakPanel.querySelector('.grid');
const cloakSw = document.querySelector('#cloakBtn .sw');
CLOAKS.forEach((c,i)=>{
  const b = document.createElement('div'); b.className = 'cl'; b.title = c.name;
  b.style.background = `radial-gradient(circle at 35% 35%, ${c.edge}, ${c.fill} 70%)`;
  b.addEventListener('click', ()=>setCloak(i, true));
  cloakGrid.appendChild(b);
});
function setCloak(i, save){
  const c = CLOAKS[i] || CLOAKS[0];
  cloakPath.setAttribute('fill', c.fill); cloakPath.setAttribute('stroke', c.edge);
  cloakSw.style.background = c.fill; cloakSw.style.borderColor = c.edge;
  [...cloakGrid.children].forEach((b,k)=>b.classList.toggle('on', k===i));
  cloakPanel.querySelector('.name').textContent = c.name;
  if(save){ try { localStorage.setItem('temple-cloak', String(i)); } catch(e){} }
}
let savedCloak = 0;
try { savedCloak = parseInt(localStorage.getItem('temple-cloak'), 10) || 0; } catch(e){}
setCloak(savedCloak, false);
document.getElementById('cloakBtn').addEventListener('click', ()=>cloakPanel.classList.toggle('show'));
cloakPanel.addEventListener('pointerdown', e=>e.stopPropagation());
vp.addEventListener('pointerdown', ()=>cloakPanel.classList.remove('show'));
</script>
