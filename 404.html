<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost in the Void · Temple of Chaos</title>
<meta name="robots" content="noindex">
<!-- Absolute links, because this page can appear at any wrong address -->
<link rel="icon" type="image/svg+xml" href="/TempleOfChaos/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/TempleOfChaos/favicon.png">
<link rel="apple-touch-icon" href="/TempleOfChaos/apple-touch-icon.png">
<meta name="theme-color" content="#050507">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050507;color:#e8e3d8;font-family:Georgia,"Times New Roman",serif;overflow:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
a{color:inherit;text-decoration:none}

/* the void */
.void{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 42%, rgba(91,42,134,.32), rgba(20,8,28,.2) 30%, transparent 60%)}
.ring{position:fixed;left:50%;top:42%;border-radius:50%;border:1px solid rgba(213,187,140,.12);transform:translate(-50%,-50%);
  animation:pulse 9s ease-in-out infinite}
.ring:nth-child(2){width:260px;height:260px}
.ring:nth-child(3){width:400px;height:400px;animation-delay:-3s}
.ring:nth-child(4){width:560px;height:560px;animation-delay:-6s}
@keyframes pulse{50%{opacity:.35;transform:translate(-50%,-50%) scale(1.06)}}
.mote{position:fixed;width:3px;height:3px;border-radius:50%;background:#e9d6a8;box-shadow:0 0 8px 2px rgba(214,188,137,.5);
  pointer-events:none;animation:sink linear infinite}
@keyframes sink{0%{opacity:0;transform:translate(0,0) scale(1)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

main{position:relative;z-index:2;max-width:520px}
.star{width:120px;height:120px;margin:0 auto;color:#d6bc89;filter:drop-shadow(0 0 18px rgba(214,188,137,.55));
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{margin-top:34px;color:#82796e;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
h1{margin-top:14px;font-weight:normal;font-size:clamp(26px,6vw,38px);letter-spacing:.1em;color:#d6bc89}
p{margin-top:16px;color:#a89e90;font-size:17px;line-height:1.65;font-style:italic}
.paths{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.paths a{padding:11px 20px;border:1px solid rgba(213,187,140,.4);background:rgba(7,7,8,.7);color:#d9c7a4;font-size:12px;letter-spacing:.18em}
.paths a:hover{background:rgba(213,187,140,.08);border-color:rgba(213,187,140,.7)}
.paths a.main{border-color:rgba(213,187,140,.75);color:#d6bc89}
</style>
</head>
<body>

<div class="void"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>

<main>
  <svg class="star" viewBox="0 0 64 64" aria-hidden="true">
    <g stroke="currentColor" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M32 22 V9 M32 42 V55 M22 32 H9 M42 32 H55 M24.9 24.9 L15.7 15.7 M39.1 39.1 L48.3 48.3 M39.1 24.9 L48.3 15.7 M24.9 39.1 L15.7 48.3"/>
      <circle cx="32" cy="32" r="6"/>
    </g>
    <g fill="currentColor">
      <path d="M32 3 L36.5 11 H27.5Z"/><path d="M32 61 L27.5 53 H36.5Z"/><path d="M3 32 L11 27.5 V36.5Z"/><path d="M61 32 L53 36.5 V27.5Z"/>
      <path d="M11.5 11.5 L20.3 14 L14 20.3Z"/><path d="M52.5 52.5 L43.7 50 L50 43.7Z"/><path d="M52.5 11.5 L50 20.3 L43.7 14Z"/><path d="M11.5 52.5 L14 43.7 L20.3 50Z"/>
    </g>
  </svg>

  <div class="eyebrow">Temple of Chaos · 404</div>
  <h1>You have wandered into the void</h1>
  <p>This path leads nowhere, or it has already returned to chaos.<br>Even here, the way back is never lost.</p>

  <nav class="paths">
    <a class="main" href="/TempleOfChaos/">RETURN TO THE TEMPLE</a>
    <a href="/TempleOfChaos/gardens.html">SACRED GARDENS</a>
    <a href="/TempleOfChaos/tarot.html">THE TAROT</a>
  </nav>
</main>

<script>
// motes of light slowly drawn into the void
for(let i=0;i<26;i++){
  const m = document.createElement('div'); m.className = 'mote';
  const x = Math.random()*100, y = Math.random()*100;
  m.style.left = x+'vw'; m.style.top = y+'vh';
  m.style.setProperty('--dx', ((50-x)*0.8)+'vw'); m.style.setProperty('--dy', ((42-y)*0.8)+'vh');
  m.style.animationDuration = (8+Math.random()*10)+'s'; m.style.animationDelay = (-Math.random()*18)+'s';
  document.body.appendChild(m);
}
</script>
</body>
</html>
