<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Garden of Kali</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d8b46a; --ember:#e0592f; --violet:#5b2a86;
  --night:#0b0710; --ink:#ece2d0; --panel:rgba(18,10,24,.92);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);
  font-family:'Cormorant Garamond',serif;touch-action:none;user-select:none;-webkit-user-select:none}

/* ---------- WORLD ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#world{position:absolute;left:0;top:0;width:1400px;height:1400px;will-change:transform;
  background:
    radial-gradient(circle at 50% 48%, rgba(160,18,40,.32) 0, rgba(160,18,40,0) 35%),
    repeating-radial-gradient(circle at 13px 17px, rgba(40,70,45,.25) 0 2px, transparent 2px 23px),
    repeating-radial-gradient(circle at 5px 9px, rgba(20,40,25,.4) 0 1.5px, transparent 1.5px 17px),
    radial-gradient(circle at 50% 48%, #1d2a20 0, #111c15 55%, #070d09 100%);}
.ground{position:absolute;pointer-events:none}
.ring{border-radius:50%;border:44px solid rgba(130,110,95,.22);box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 0 30px rgba(0,0,0,.4)}
.plaza{border-radius:50%;background:
  repeating-conic-gradient(from 0deg at 50% 50%, rgba(140,125,115,.22) 0 15deg, rgba(110,95,90,.22) 15deg 30deg);
  box-shadow:0 0 60px rgba(216,180,106,.12), inset 0 0 40px rgba(0,0,0,.6)}
.walk{background:rgba(130,110,95,.22);box-shadow:inset 0 0 14px rgba(0,0,0,.5)}

.sprite{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.flip{display:block;transition:transform .15s}

/* player */
#player .body{animation:none}
#player.moving .body{animation:bob .35s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.lantern{filter:drop-shadow(0 0 6px #ffb347)}
#player::after{content:"";position:absolute;left:50%;top:60%;width:140px;height:140px;transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,190,110,.18), transparent 70%);pointer-events:none}

/* statue + altar */
.halo{animation:pulse 4s ease-in-out infinite;transform-origin:120px 34px}
@keyframes pulse{50%{opacity:.55;transform:scale(1.15)}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.9)}}
#altar{position:relative}
#offerings{position:absolute;left:14px;right:14px;top:-18px;height:40px}
.placed{position:absolute;bottom:0;transform:translateX(-50%);width:30px;height:30px}
.placed svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.placed.new{animation:land .6s ease-out}
@keyframes land{0%{transform:translate(-50%,-40px) scale(1.4);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.altar-glow{position:absolute;inset:-30px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,140,60,.45), transparent 65%);opacity:0;transition:opacity .4s}
.altar-glow.on{opacity:1}

/* symbol stones */
.symbol{display:flex;flex-direction:column;align-items:center}
.glyph{width:44px;height:44px;color:var(--gold);filter:drop-shadow(0 0 6px rgba(216,180,106,.85));animation:float 3.2s ease-in-out infinite}
.glyph svg{width:100%;height:100%}
.stone{width:46px;height:44px;margin-top:6px;border-radius:4px 4px 2px 2px;
  background:linear-gradient(90deg,#3d3745,#6e6578 50%,#3a3442);box-shadow:0 8px 10px rgba(0,0,0,.5);
  border-top:4px solid #7c7388}
.symbol.near .glyph{color:#fff1c8;filter:drop-shadow(0 0 12px rgba(255,220,150,1))}
@keyframes float{50%{transform:translateY(-6px)}}

.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,220,120,.7);
  pointer-events:none;animation:drift linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}20%{opacity:1}50%{transform:translate(30px,-40px)}80%{opacity:1}100%{transform:translate(-20px,-80px);opacity:0}}
.orb{width:10px;height:10px;border-radius:50%;background:#ffcf8a;box-shadow:0 0 14px 5px rgba(255,170,80,.45);animation:float 4s ease-in-out infinite}

/* ---------- UI ---------- */
.ui{position:fixed;z-index:5000}
#topbar{top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
  background:linear-gradient(rgba(11,7,16,.95),rgba(11,7,16,0))}
#topbar h1{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.12em;color:var(--gold);font-weight:400;text-align:center;flex:1}
.btn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;color:var(--ink);background:rgba(91,42,134,.35);
  border:1px solid rgba(216,180,106,.45);border-radius:20px;padding:6px 12px;text-decoration:none;cursor:pointer}
#hint{top:50px;left:50%;transform:translateX(-50%);font-style:italic;font-size:15px;color:rgba(236,226,208,.75);
  text-align:center;padding:0 16px;transition:opacity 1s;pointer-events:none;width:100%}

#card{left:12px;right:12px;bottom:12px;max-width:520px;margin:0 auto;max-height:46vh;overflow-y:auto;
  background:var(--panel);border:1px solid rgba(216,180,106,.4);border-radius:14px;padding:16px 18px 18px;
  box-shadow:0 0 40px rgba(91,42,134,.5);transform:translateY(130%);transition:transform .35s ease}
#card.show{transform:translateY(0)}
#card .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#card .icon{width:40px;height:40px;color:var(--gold);flex:none}
#card h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);font-weight:400}
#card .sub{font-style:italic;font-size:14px;opacity:.7}
#card{z-index:5100}
#card p{font-size:17px;line-height:1.45;margin-bottom:10px}
#card h3{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;color:var(--gold);font-weight:400;
  margin:14px 0 4px;padding-top:10px;border-top:1px solid rgba(216,180,106,.2)}
#card.lore{max-height:62vh}
.figs{display:flex;justify-content:center;gap:24px;margin:4px 0 12px}
.fig{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gold)}
.fig svg{width:96px;height:96px;filter:drop-shadow(0 0 6px rgba(216,180,106,.6))}
.fig span{font-size:13px;font-style:italic;opacity:.75;color:var(--ink)}
#loreBtn{margin:8px 6px 0 0;font-size:10px}
#card .x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer;opacity:.7}

#tray{left:0;right:0;bottom:0;padding:10px 10px 14px;background:linear-gradient(rgba(11,7,16,0),rgba(11,7,16,.96) 30%);
  transform:translateY(110%);transition:transform .35s ease;text-align:center}
#tray.show{transform:translateY(0)}
#tray .label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;color:var(--gold);margin:14px 0 8px}
#items{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.off{width:54px;cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.off .pic{width:46px;height:46px;border-radius:50%;background:rgba(91,42,134,.3);border:1px solid rgba(216,180,106,.35);
  display:flex;align-items:center;justify-content:center}
.off .pic svg{width:32px;height:32px;pointer-events:none}
.off span{font-size:12px;line-height:1.1;opacity:.85}
#clear{margin-top:8px;font-size:10px;opacity:.7}

.ghost{position:fixed;z-index:9000;width:48px;height:48px;transform:translate(-50%,-50%) scale(1.2);pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(255,200,120,.9))}
.ghost svg{width:100%;height:100%}
#toast{left:50%;top:90px;transform:translate(-50%,-20px);max-width:90%;width:max-content;background:var(--panel);
  border:1px solid rgba(216,180,106,.5);border-radius:12px;padding:10px 16px;font-size:16px;font-style:italic;text-align:center;
  opacity:0;transition:all .4s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* cloak colour picker */
#cloakBtn{display:flex;align-items:center;gap:6px;width:auto}
#cloakBtn .sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
#cloakPanel{top:54px;right:12px;width:232px;background:var(--panel);border:1px solid rgba(216,180,106,.4);border-radius:14px;
  padding:14px 12px 12px;box-shadow:0 0 40px rgba(0,0,0,.6);display:none}
#cloakPanel.show{display:block}
#cloakPanel .t{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;color:var(--gold);text-align:center;margin-bottom:12px}
#cloakPanel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;justify-items:center}
.cl{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:transform .15s}
.cl:hover{transform:scale(1.1)}
.cl.on{border-color:#fff1c8;box-shadow:0 0 12px rgba(255,220,150,.8)}
#cloakPanel .name{margin-top:12px;text-align:center;font-style:italic;font-size:15px;opacity:.85}

/* day and night */
#sky{position:fixed;inset:0;pointer-events:none;z-index:4000;transition:background 2s}
#flies{position:absolute;inset:0;pointer-events:none;z-index:3000;transition:opacity 2s}
#world{transition:filter 2s}

/* night lights above the darkness */
#lightsWrap{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:4500}
#lights{position:absolute;left:0;top:0;width:1400px;height:1400px;will-change:transform}
#glows{position:absolute;inset:0;transition:opacity 2s}
.lglow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.lglow.pulse{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7}}

/* meditation bench */
#sitBtn{bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);transition:transform .35s ease;font-size:12px;padding:10px 20px;z-index:5050}
#sitBtn.show{transform:translateX(-50%) translateY(0)}
#medi{position:fixed;inset:0;z-index:7000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 45%, var(--mc), rgba(5,3,8,.97) 68%)}
#medi.show{display:flex}
#medi .close{position:absolute;top:12px;right:18px;background:none;border:0;color:var(--ink);font-size:30px;opacity:.7;cursor:pointer}
#medi .deity{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.25em;opacity:.6}
#medi h2{margin-top:8px;font-family:'Cinzel',serif;font-weight:400;font-size:21px;letter-spacing:.12em;color:var(--mcol)}
#medi .intro{max-width:420px;margin:14px auto 24px;font-size:18px;line-height:1.5;font-style:italic;opacity:.85}
#medi .mdur{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#medi .stage{display:none;flex-direction:column;align-items:center}
#medi .stage.on{display:flex}
.morb{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mcol);
  background:radial-gradient(circle, var(--mc2), transparent 70%);box-shadow:0 0 70px var(--mc2);transform:scale(.7);transition:transform 4s ease-in-out}
.morb svg{width:84px;height:84px;filter:drop-shadow(0 0 12px currentColor)}
#mPhase{margin-top:30px;font-family:'Cinzel',serif;letter-spacing:.22em;font-size:13px;color:var(--mcol)}
#mLine{margin-top:14px;max-width:440px;min-height:62px;font-size:20px;line-height:1.5;transition:opacity 1.2s}
#mTime{margin-top:16px;font-size:13px;opacity:.5}
#medi .closing{max-width:420px;margin:22px auto 26px;font-size:21px;line-height:1.5;font-style:italic}
</style>
</head>
<body>

<div id="viewport"><div id="world"></div></div>

<div id="topbar" class="ui">
  <a class="btn" href="gardens.html">← Gardens</a>
  <h1>Garden of Kali Ma</h1>
  <button id="cloakBtn" class="btn" aria-label="Choose cloak colour"><span class="sw"></span>Cloak</button>
</div>
<div id="cloakPanel" class="ui">
  <div class="t">CHOOSE YOUR CLOAK</div>
  <div class="grid"></div>
  <div class="name"></div>
</div>
<div id="hint" class="ui">Tap anywhere to walk (or use arrow keys / WASD).<br>Visit her symbols, then bring offerings to the altar.</div>

<div id="card" class="ui">
  <button class="x" aria-label="Close">×</button>
  <div class="head"><div class="icon"></div><div><h2></h2><div class="sub"></div></div></div>
  <div class="body"></div>
</div>

<div id="tray" class="ui">
  <div class="label">Drag an offering onto the altar</div>
  <div id="items"></div>
  <button id="loreBtn" class="btn">✦ Her lore</button>
  <button id="clear" class="btn">Clear the altar</button>
</div>
<div id="sky"></div>
<div id="toast" class="ui"></div>

<script>
/* =========================================================
   EDIT HERE: deity, symbols and offerings
   ========================================================= */
const DEITY = "KALI";
const STORAGE_KEY = "garden-offerings-kali";

const SYMBOLS = [
  { name:"The Kali Yantra", sub:"Her sacred diagram",
    text:"A sacred geometric diagram used to meditate on Kali and to invoke her. The downward triangles are Shakti, the feminine power. The central point, the bindu, is the source of all creation. The square with four gates is the world, through which the seeker enters.",
    svg:`<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 5 H24 V9 H36 V5 H55 V24 H51 V36 H55 V55 H36 V51 H24 V55 H5 V36 H9 V24 H5Z"/><circle cx="30" cy="30" r="19"/><path d="M15 21 H45 L30 47Z M19 24 H41 L30 42Z M23 27 H37 L30 38Z"/><circle cx="30" cy="31" r="1.8" fill="currentColor"/></svg>` },
  { name:"The Sword", sub:"Khadga",
    text:"Her sword cuts through ignorance and the false self. What it severs is not life but illusion: the attachments and the ego that keep a soul bound.",
    svg:`<svg viewBox="0 0 60 60"><path d="M22 44 C18 30 22 14 36 5 C34 16 32 30 30 44Z" fill="currentColor"/><path d="M16 44 H36" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M26 46 L25 57" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>` },
  { name:"The Garland of Heads", sub:"Mundamala",
    text:"She wears a garland of severed heads, often counted as fifty. In tantric teaching they are the fifty letters of the Sanskrit alphabet: the sounds from which all names and forms are made, gathered back into her.",
    svg:`<svg viewBox="0 0 60 60"><path d="M9 10 C12 30 20 41 30 41 C40 41 48 30 51 10" stroke="currentColor" stroke-width="1.2" fill="none"/><g fill="currentColor"><circle cx="9" cy="10" r="3.6"/><circle cx="12" cy="21" r="3.6"/><circle cx="17" cy="31" r="3.6"/><circle cx="23" cy="38" r="3.6"/><circle cx="30" cy="41" r="3.6"/><circle cx="37" cy="38" r="3.6"/><circle cx="43" cy="31" r="3.6"/><circle cx="48" cy="21" r="3.6"/><circle cx="51" cy="10" r="3.6"/></g></svg>` },
  { name:"The Red Tongue", sub:"Victory over Raktabija",
    text:"Her tongue reaches out, red with the blood of the demon Raktabija. She defeated him by drinking his blood before it could touch the ground. In Bengal, many tell how she bit her tongue on realising she had stepped onto Shiva.",
    svg:`<svg viewBox="0 0 60 60"><path d="M12 22 C20 30 40 30 48 22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M22 27 C22 44 26 54 30 54 C34 54 38 44 38 27Z" fill="#c21f30"/><path d="M30 33 V47" stroke="#7a0f1c" stroke-width="1.5"/><path d="M17 25 L19.5 32 L22 26.5Z M43 25 L40.5 32 L38 26.5Z" fill="#f2ead8"/></svg>` },
  { name:"The Third Eye", sub:"Sight beyond time",
    text:"Her third eye sees past time itself: past, present and future at once. It is the eye of wisdom, and it burns illusion away.",
    svg:`<svg viewBox="0 0 60 60"><path d="M30 6 C44 18 44 42 30 54 C16 42 16 18 30 6Z" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="30" cy="30" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="30" cy="30" r="3" fill="#c21f30"/></svg>` },
  { name:"The Fearless Hands", sub:"Abhaya and Varada",
    text:"Two of her hands hold the sword and the severed head. The other two make blessing gestures: abhaya, “do not fear”, and varada, the giving of boons. The Mother who destroys is the same Mother who protects her children.",
    svg:`<svg viewBox="0 0 60 60"><path d="M21 56 V31 L17 25 C15 21 19 19 21 22 L22 24 V11 C22 8 26 8 26 11 V8 C26 5 30 5 30 8 V10 C30 7 34 7 34 10 V14 C34 11 38 11 38 14 V38 C38 48 35 52 33 56Z" fill="currentColor"/><circle cx="30" cy="34" r="3" fill="#c21f30"/></svg>` },
  { name:"The Cremation Ground", sub:"Shmashana",
    text:"Kali dwells in the cremation ground, where bodies return to ash. To her devotees it is the place where every illusion burns away and nothing false survives. Some teachers say the true cremation ground is the heart, once the ego has burned there.",
    svg:`<svg viewBox="0 0 60 60"><path d="M9 52 L51 44 M9 44 L51 52" stroke="#7a4a2a" stroke-width="5" stroke-linecap="round"/><path d="M30 5 C41 17 45 28 39 41 H21 C15 28 19 17 30 5Z" fill="#e0592f"/><path d="M30 18 C36 25 37 33 34 41 H26 C23 33 24 25 30 18Z" fill="#ffcf70"/><path d="M14 41 C11 34 13 28 17 24 C17 31 20 35 22 41Z M46 41 C49 34 47 28 43 24 C43 31 40 35 38 41Z" fill="currentColor"/></svg>` }
];

const LORE = {
  name:"Kali", sub:"The Dark Mother · She Who Is Time",
  sections:[
    { title:"Her Name",
      text:"Kālī comes from the Sanskrit kāla, which means both “time” and “black”. She is the Black One, and she is Time itself, which devours all things. She is the power behind time, death and change." },
    { title:"Born of Battle",
      text:"In the Devi Mahatmya, a sacred text from around the 5th or 6th century CE, the goddess Durga grows so furious in battle that Kali bursts from her brow. Kali slays the demon generals Chanda and Munda, and so she is also called Chamunda. She defeated Raktabija, whose every drop of spilled blood became a new demon, by drinking his blood before it could reach the ground." },
    { title:"Upon Shiva",
      text:"Her victory dance grew so wild that it threatened to shake the worlds apart. Shiva lay down in her path, and when she stepped onto him she stopped, tongue out. Tantric teachers read this image as Shakti, the active power, dancing on Shiva, pure consciousness. Neither is complete without the other." },
    { title:"Her Form",
      text:"Her skin is black or deep blue, the colour of the infinite void from which everything arises and to which it returns. She is naked, clothed only in space and beyond every illusion. She wears a skirt of severed arms, standing for actions and karma. Of her four arms, two destroy and two bless." },
    { title:"The Mother",
      text:"To millions of Hindus, especially in Bengal, she is Ma, the loving Mother. The 18th-century poet Ramprasad Sen sang to her the way a child sings to its mother. The 19th-century mystic Ramakrishna worshipped her at the Dakshineswar temple near Kolkata. Kali Puja is celebrated on the new-moon night of the month of Kartika, at the time of Diwali." },
    { title:"In Tantra",
      text:"She is the first of the ten Mahavidyas, the great wisdom goddesses of Tantra. Her forms include Dakshina Kali, the most widely worshipped; Shmashana Kali, of the cremation ground; and Adya Kali, the primordial one, who existed before creation itself." },
    { title:"With Respect",
      text:"Kali is a living goddess, worshipped today in Hindu temples and homes. Approaching her through her own traditions, mantras and teachers honours both her and the people who have kept her worship alive." },
    { title:"Correspondences",
      text:"Night: the new moon (Amavasya). Colours: black and red. Flower: red hibiscus. Bija mantra: Krīm. Mantra: Om Krīm Kālikāyai Namaḥ. Great temples: Kalighat and Dakshineswar in Kolkata. Offerings: red hibiscus, lamps, incense, sweets, kumkum and coconut." }
  ]
};

const OFFERINGS = {
  hibiscus:{ label:"Hibiscus", msg:"A red hibiscus, her most beloved flower, red as her tongue and as the blood of life.",
    svg:`<svg viewBox="0 0 40 40"><g fill="#c8102e"><ellipse cx="20" cy="10" rx="7" ry="9"/><ellipse cx="30" cy="17" rx="7" ry="9" transform="rotate(72 30 17)"/><ellipse cx="26" cy="29" rx="7" ry="9" transform="rotate(144 26 29)"/><ellipse cx="14" cy="29" rx="7" ry="9" transform="rotate(216 14 29)"/><ellipse cx="10" cy="17" rx="7" ry="9" transform="rotate(288 10 17)"/></g><circle cx="20" cy="20" r="4" fill="#7a0a1c"/><path d="M20 20 L29 9" stroke="#ffd34a" stroke-width="1.5"/><circle cx="29" cy="9" r="2" fill="#ffd34a"/></svg>` },
  diya:{ label:"Lamp", msg:"A lamp is lit for her: light offered to the Dark Mother, who holds all light within her.",
    svg:`<svg viewBox="0 0 40 40"><path d="M5 24 C9 35 31 35 35 24 C28 27 12 27 5 24Z" fill="#b4602e"/><path d="M5 24 Q20 19 35 24 Q20 27 5 24Z" fill="#6e3818"/><path class="flame" d="M31 10 C35 14 35 19 31 21 C27 19 27 14 31 10Z" fill="#ffb347"/></svg>` },
  incense:{ label:"Incense", msg:"Incense rises, its smoke carrying your devotion to her.",
    svg:`<svg viewBox="0 0 40 40"><path d="M8 36 H32" stroke="#6e6578" stroke-width="4" stroke-linecap="round"/><path d="M20 34 L22 14" stroke="#7a2b1d" stroke-width="2"/><path d="M22 13 C17 9 26 7 21 2" stroke="#cfc3d6" stroke-width="1.5" fill="none" opacity=".8"/></svg>` },
  sweets:{ label:"Sweets", msg:"Sweets offered as prasad, blessed by the Mother and shared out again.",

/* =========================================================
   MOVEMENT + CAMERA
   ========================================================= */
let px = CX, py = H-90, tx = null, ty = null, facing = 1;
let camX = 0, camY = 0;
const SPEED = 190, keys = {};
const KEYMAP = {ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{ if(KEYMAP[e.key]){keys[KEYMAP[e.key]]=true; e.preventDefault(); hideHint();} });
addEventListener('keyup',e=>{ if(KEYMAP[e.key]) keys[KEYMAP[e.key]]=false; });

vp.addEventListener('pointerdown', e=>{
  tx = e.clientX + camX; ty = e.clientY + camY; hideHint();
});

function collide(){
  for(const o of obstacles){
    const dx = px-o.x, dy = py-o.y, d = Math.hypot(dx,dy), min = o.r + 12;
    if(d < min && d > 0.01){ px = o.x + dx/d*min; py = o.y + dy/d*min; }
  }
  px = Math.max(20, Math.min(W-20, px)); py = Math.max(40, Math.min(H-10, py));
}

function step(dt){
  let vx = (keys.r?1:0)-(keys.l?1:0), vy = (keys.d?1:0)-(keys.u?1:0);
  if(vx||vy) tx = null;
  else if(tx !== null){
    const dx = tx-px, dy = ty-py, d = Math.hypot(dx,dy);
    if(d < 5) tx = null; else { vx = dx/d; vy = dy/d; }
  }
  const m = Math.hypot(vx,vy), moving = m > 0;
  if(moving){
    vx/=m; vy/=m;
    const ox = px, oy = py;
    px += vx*SPEED*dt; py += vy*SPEED*dt; collide();
    if(tx !== null && Math.hypot(px-ox,py-oy) < SPEED*dt*0.25) tx = null; // stuck
    if(Math.abs(vx) > .2) facing = vx < 0 ? -1 : 1;
  }
  player.classList.toggle('moving', moving);
  flipEl.style.transform = `scaleX(${facing})`;
  player.style.left = px+'px'; player.style.top = py+'px'; player.style.zIndex = Math.round(py);

  const vw = innerWidth, vh = innerHeight;
  const goalX = vw >= W ? (W-vw)/2 : Math.max(0, Math.min(W-vw, px - vw/2));
  const goalY = vh >= H ? (H-vh)/2 : Math.max(0, Math.min(H-vh, py - vh*0.45));
  camX += (goalX-camX)*Math.min(1, dt*6); camY += (goalY-camY)*Math.min(1, dt*6);
  world.style.transform = `translate(${-camX}px,${-camY}px)`;
  if(window.__lights){ window.__lights.style.transform = world.style.transform; window.__onFrame(); }

  checkNearby();
}

let last = performance.now();
camX = Math.max(0, Math.min(W-innerWidth, px-innerWidth/2));
camY = Math.max(0, Math.min(H-innerHeight, py-innerHeight*0.45));
function loop(t){ const dt = Math.min(.05,(t-last)/1000); last = t; step(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

function showCard(i){
  if(i === current) return;
  current = i;
  symbolEls.forEach((s,k)=>s.classList.toggle('near', k===i));
  if(i === -1){ card.classList.remove('show'); return; }
  const isLore = i === 'lore';
  const s = isLore ? LORE : SYMBOLS[i];
  card.classList.toggle('lore', isLore);
  card.querySelector('.icon').innerHTML = SYMBOLS[isLore ? 0 : i].svg;
  card.querySelector('h2').textContent = s.name;
  card.querySelector('.sub').textContent = s.sub;
  const body = card.querySelector('.body'); body.innerHTML = '';
  if(!isLore && s.figures){
    const row = document.createElement('div'); row.className = 'figs';
    s.figures.forEach(f=>{
      const fig = document.createElement('div'); fig.className = 'fig';
      fig.innerHTML = f.svg; const c = document.createElement('span'); c.textContent = f.caption;
      fig.appendChild(c); row.appendChild(fig);
    });
    body.appendChild(row);
  }
  (isLore ? s.sections : [{text:s.text}]).forEach(sec=>{
    if(sec.title){ const h = document.createElement('h3'); h.textContent = sec.title; body.appendChild(h); }
    const p = document.createElement('p'); p.textContent = sec.text; body.appendChild(p);
  });
  card.scrollTop = 0; card.classList.add('show');
}
function checkNearby(){
  let best = -1, bd = 110;
  SYMBOLS.forEach((s,i)=>{ const d = Math.hypot(px-s.x, py-s.y); if(d < bd){ bd = d; best = i; } });
  const nearAltar = Math.hypot(px-ALTAR.x, py-ALTAR.y) < 170;
  if(!nearAltar) loreOpen = false;
  if(best === -1 && (loreOpen || Math.hypot(px-CX, py-(CY-60)) < 150)) best = 'lore';
  if(best !== dismissed) showCard(best);
  if(best === -1) dismissed = -1;
  tray.classList.toggle('show', nearAltar);
}

  dawn: { b:.95, s:1,   t:[255,140,130,.16], f:.45, icon:'◐', name:'Dawn'  },
  day:  { b:1.3, s:1.15,t:[255,240,200,.07], f:0,   icon:'☀', name:'Day'   },
  dusk: { b:.92, s:1.05,t:[255,105,60,.2],   f:.6,  icon:'◑', name:'Dusk'  }
};
const SKY_HOURS = [[0,'night'],[5,'night'],[6.5,'dawn'],[8,'day'],[17.5,'day'],[19.5,'dusk'],[21,'night'],[24,'night']];
function mixN(a,b,t){ return a+(b-a)*t; }
function skyAt(h){
  for(let i=0;i<SKY_HOURS.length-1;i++){
    const [h0,p0] = SKY_HOURS[i], [h1,p1] = SKY_HOURS[i+1];
    if(h >= h0 && h <= h1){
      const t = h1 === h0 ? 0 : (h-h0)/(h1-h0), A = PHASES[p0], B = PHASES[p1];
      return { b:mixN(A.b,B.b,t), s:mixN(A.s,B.s,t), t:A.t.map((v,k)=>mixN(v,B.t[k],t)), f:mixN(A.f,B.f,t), p:t<.5?p0:p1 };
    }
  }
  return { ...PHASES.night, p:'night' };
}
function applySky(){
  const now = new Date();
  const st = skyAt(now.getHours() + now.getMinutes()/60);
  world.style.filter = `brightness(${st.b.toFixed(2)}) saturate(${st.s.toFixed(2)})`;
  sky.style.background = `rgba(${Math.round(st.t[0])},${Math.round(st.t[1])},${Math.round(st.t[2])},${st.t[3].toFixed(2)})`;
  flies.style.opacity = st.f.toFixed(2);
  if(window.__glows) window.__glows.style.opacity = (st.f*0.95).toFixed(2);
}
applySky(); setInterval(applySky, 60000);

/* =========================================================
   NIGHT LIGHTS: fireflies, lamps, altar candles and your
   lantern shine above the darkness and glow brighter at night
   ========================================================= */
const lightsWrap = document.createElement('div'); lightsWrap.id = 'lightsWrap';
const lights = document.createElement('div'); lights.id = 'lights';
lightsWrap.appendChild(lights); document.body.insertBefore(lightsWrap, document.getElementById('topbar'));
lights.appendChild(flies);
// lamps
world.querySelectorAll('.orb').forEach(o=>lights.appendChild(o.parentElement));
const glows = document.createElement('div'); glows.id = 'glows'; lights.appendChild(glows);
function glowAt(x, y, size, color){
  const g = document.createElement('div'); g.className = 'lglow';
  Object.assign(g.style,{ left:x+'px', top:y+'px', width:size+'px', height:size+'px',
    background:`radial-gradient(circle, ${color}, transparent 70%)` });
  glows.appendChild(g); return g;
}
lights.querySelectorAll('.orb').forEach(o=>{
  const sp = o.parentElement; glowAt(parseFloat(sp.style.left), parseFloat(sp.style.top)-6, 140, 'rgba(255,180,90,.75)').classList.add('pulse');
});
glowAt(ALTAR.x-95, ALTAR.y-92, 90, 'rgba(255,170,80,.65)');
glowAt(ALTAR.x+95, ALTAR.y-92, 90, 'rgba(255,170,80,.65)');
// the statue's own lights (torches, stars, halos)
const STATUE_LIGHTS = [[120,88,230,'rgba(255,70,50,.35)'],[120,76,50,'rgba(255,210,120,.7)']];
STATUE_LIGHTS.forEach(([x,y,size,color])=>glowAt(CX-120+x, CY-350+y, size, color).classList.add('pulse'));
const lanternGlow = glowAt(0, 0, 200, 'rgba(255,190,110,.5)');
window.__onFrame = ()=>{ lanternGlow.style.left = (px + 12*facing)+'px'; lanternGlow.style.top = (py-18)+'px'; };
window.__glows = glows;
window.__lights = lights;
applySky();

/* =========================================================
   MEDITATION BENCH (edit the bench look and the meditation here)
   ========================================================= */
const BENCH = {"angle": 192, "stone": "#2b2330", "dark": "#1e1822", "trim": "#d8b46a", "cushion": "#a3172b", "emblem": 0};
const MEDITATION = {
  "deity": "Kali",
  "title": "Into the Mother's Darkness",
  "symbol": 0,
  "mc": "rgba(150,15,35,.42)",
  "mc2": "rgba(255,80,60,.35)",
  "color": "#e8c77a",
  "intro": "Sit before the Dark Mother, the one who is Time itself.",
  "lines": [
    "Feel each breath arise, and pass away.",
    "Every thought that comes, let it return to the dark.",
    "Name one fear you carry. Offer it to her sword.",
    "What is cut away was never truly you.",
    "Beneath all change, something remains still.",
    "Rest in her darkness, as a child rests with its mother."
  ],
  "closing": "Jai Ma. Go without fear."
};

const ba = BENCH.angle*Math.PI/180, BX = CX + Math.cos(ba)*420, BY = CY + Math.sin(ba)*420;
const benchEmblem = SYMBOLS[BENCH.emblem].svg.replace('<svg ', `<svg x="51" y="21" width="18" height="18" style="color:${BENCH.trim}" `);
el('', BX, BY, `<svg viewBox="0 0 120 64" width="110" height="59">
  <ellipse cx="60" cy="60" rx="54" ry="5" fill="rgba(0,0,0,.45)"/>
  <rect x="14" y="34" width="14" height="24" fill="${BENCH.dark}"/><rect x="92" y="34" width="14" height="24" fill="${BENCH.dark}"/>
  <rect x="4" y="20" width="112" height="16" rx="3" fill="${BENCH.stone}" stroke="${BENCH.trim}" stroke-width="1.5"/>
  <rect x="16" y="13" width="88" height="8" rx="4" fill="${BENCH.cushion}"/>
  ${benchEmblem}</svg>`);
obstacles.push({ x:BX, y:BY-12, r:30 });

document.body.insertAdjacentHTML('beforeend', `
<button id="sitBtn" class="btn ui">✦ Sit and meditate</button>
<div id="medi" style="--mc:${MEDITATION.mc};--mc2:${MEDITATION.mc2};--mcol:${MEDITATION.color}">
  <button class="close" aria-label="Close">×</button>
  <div class="stage on" data-s="start">
    <div class="deity">MEDITATION WITH ${MEDITATION.deity.toUpperCase()}</div>
    <h2></h2><p class="intro"></p>
    <div class="mdur"><button class="btn" data-m="1">1 minute</button><button class="btn" data-m="3">3 minutes</button><button class="btn" data-m="5">5 minutes</button></div>
  </div>
  <div class="stage" data-s="run">
    <div class="morb"></div><div id="mPhase"></div><div id="mLine"></div><div id="mTime"></div>
  </div>
  <div class="stage" data-s="end">
    <div class="morb" style="transform:scale(1)"></div><p class="closing"></p>
    <button class="btn" data-a="back">Return to the garden</button>
  </div>
</div>`);
const sitBtn = document.getElementById('sitBtn'), medi = document.getElementById('medi');
medi.querySelector('h2').textContent = MEDITATION.title;
medi.querySelector('.intro').textContent = MEDITATION.intro;
medi.querySelector('.closing').textContent = MEDITATION.closing;
medi.querySelectorAll('.morb').forEach(o=>o.innerHTML = SYMBOLS[MEDITATION.symbol].svg);
const mOrb = medi.querySelector('[data-s="run"] .morb'), mPhase = document.getElementById('mPhase'),
      mLine = document.getElementById('mLine'), mTime = document.getElementById('mTime');
let meditating = false, mTimer = null, mClock = null, mAudio = null;
function mStage(n){ medi.querySelectorAll('.stage').forEach(s=>s.classList.toggle('on', s.dataset.s===n)); }
function bell(){
  try {
    if(!mAudio) mAudio = new (window.AudioContext||window.webkitAudioContext)();
    const t = mAudio.currentTime;
    [528, 792].forEach((f,i)=>{
      const o = mAudio.createOscillator(), g = mAudio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(i?0.06:0.18, t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t+4.5);
      o.connect(g); g.connect(mAudio.destination); o.start(t); o.stop(t+4.6);
    });
  } catch(e){}
}
const BREATH = [['BREATHE IN',4000,1.15],['HOLD',2000,1.15],['BREATHE OUT',6000,.7]];
function startMeditation(mins){
  mStage('run'); bell();
  const end = Date.now() + mins*60000; let pi = 0, li = 0;
  const tick = ()=>{ const r = Math.max(0, end-Date.now()), m = Math.floor(r/60000), s = Math.floor(r%60000/1000);
    mTime.textContent = `${m}:${String(s).padStart(2,'0')}`; };
  tick(); mClock = setInterval(tick, 500);
  (function phase(){
    if(Date.now() >= end){ finishMeditation(); return; }
    const [name, dur, sc] = BREATH[pi];
    mPhase.textContent = name; mOrb.style.transitionDuration = dur+'ms'; mOrb.style.transform = `scale(${sc})`;
    if(pi === 0){
      mLine.style.opacity = 0;
      setTimeout(()=>{ mLine.textContent = MEDITATION.lines[li % MEDITATION.lines.length]; mLine.style.opacity = 1; li++; }, 600);
    }
    pi = (pi+1) % BREATH.length; mTimer = setTimeout(phase, dur);
  })();
}
function finishMeditation(){ clearTimeout(mTimer); clearInterval(mClock); bell(); mStage('end'); }
function closeMeditation(){
  clearTimeout(mTimer); clearInterval(mClock); medi.classList.remove('show'); meditating = false;
  mOrb.style.transitionDuration = '0ms'; mOrb.style.transform = 'scale(.7)'; mLine.textContent = ''; mStage('start');
}
sitBtn.addEventListener('pointerdown', e=>e.stopPropagation());
sitBtn.addEventListener('click', ()=>{ meditating = true; tx = null; medi.classList.add('show'); mStage('start'); });
medi.addEventListener('pointerdown', e=>e.stopPropagation());
medi.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click', ()=>startMeditation(+b.dataset.m)));
medi.querySelector('[data-a="back"]').addEventListener('click', closeMeditation);
medi.querySelector('.close').addEventListener('click', closeMeditation);
const prevFrame = window.__onFrame || (()=>{});
window.__onFrame = ()=>{
  prevFrame();
  if(meditating){ for(const k in keys) keys[k] = false; tx = null; }
  sitBtn.classList.toggle('show', !meditating && Math.hypot(px-BX, py-BY) < 80);
};
</script>
</body>
</html>
